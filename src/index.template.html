<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';">
  <title>FlowBoard Work OS</title>
  <meta name="description" content="FlowBoard Work OS: a calm, offline-first personal work system. Plan the week, focus with a timer, reflect daily.">
  <meta id="meta-theme-color" name="theme-color" content="#0b0f19">
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    if (typeof tailwind !== 'undefined') {
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            }
          }
        }
      }
    }
  </script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <!-- INLINE_STYLE -->
</head>
<body class="bg-[var(--bg-page)] text-[var(--text-primary)] min-h-screen flex flex-col transition-colors duration-150">
  <a href="#main-content" class="skip-link">Skip to content</a>

  <!-- Top Command Bar -->
  <header class="lg:sticky lg:top-0 z-40 border-b border-[var(--border-color)] bg-[var(--bg-card)]/90 backdrop-blur-md transition-colors">
    <div class="app-container flex flex-wrap lg:flex-nowrap items-center justify-between gap-x-3 gap-y-2 py-2 lg:py-0 lg:min-h-[4rem]">
      <!-- Brand & Title -->
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-500/20 flex-shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
        </div>
        <div class="flex flex-col">
          <span class="font-bold text-base tracking-tight text-[var(--text-primary)] leading-tight">FlowBoard</span>
          <span class="text-[10px] text-[var(--text-secondary)] font-medium uppercase tracking-wider">Work OS</span>
        </div>
      </div>

      <!-- Focus Timer (rendered by renderTimerBar in 03-timer.js) -->
      <div id="timer-bar" class="order-last lg:order-none w-full lg:w-auto lg:flex-1 min-w-0"></div>

      <!-- Right Actions: Offline badge, Shortcut help, Theme Toggle -->
      <div class="flex items-center gap-2">
        <span id="offline-indicator" class="offline-badge" hidden title="No internet connection. FlowBoard keeps working and your changes are saved on this device.">
          <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18M8.5 16.5a5 5 0 017 0M5 13a10 10 0 013.5-2.3m4.6-.6A10 10 0 0119 13M1.5 9.5A15 15 0 016 6.6m4-1.4a15 15 0 0112.5 4.3M12 20h.01"/>
          </svg>
          <span>Offline</span>
        </span>
        <button id="btn-shortcuts" type="button" data-action="open-shortcuts" class="header-icon-btn" aria-label="Keyboard shortcuts" aria-keyshortcuts="?" title="Keyboard shortcuts (?)">
          <span aria-hidden="true">?</span>
        </button>
        <button id="btn-toggle-theme" type="button" data-action="toggle-theme" class="p-2.5 rounded-xl border border-[var(--border-color)] bg-[var(--bg-card)] hover:bg-[var(--bg-secondary)] text-[var(--text-primary)] transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500 min-w-[44px] min-h-[44px] flex items-center justify-center" aria-label="Toggle theme">
          <!-- Icon injected dynamically -->
        </button>
      </div>
    </div>

    <!-- View Navigation Tabs -->
    <nav class="border-t border-[var(--border-color)]/60 bg-[var(--bg-card)]" aria-label="Main Navigation">
      <div class="app-container flex flex-col md:flex-row md:items-center md:justify-between md:gap-4">
      <div id="view-tablist" class="flex items-center gap-1 py-1.5 overflow-x-auto min-w-0" role="tablist" aria-label="Screens">
        <button type="button" role="tab" data-action="switch-view" data-view-tab="kanban" id="tab-kanban" aria-controls="main-content" aria-selected="true" class="tab-btn tab-btn-active">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2"/>
          </svg>
          <span>Kanban</span>
        </button>
        <button type="button" role="tab" data-action="switch-view" data-view-tab="planner" id="tab-planner" aria-controls="main-content" aria-selected="false" class="tab-btn tab-btn-inactive">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          </svg>
          <span>Planner</span>
        </button>
        <button type="button" role="tab" data-action="switch-view" data-view-tab="journal" id="tab-journal" aria-controls="main-content" aria-selected="false" class="tab-btn tab-btn-inactive">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
          </svg>
          <span>Journal</span>
        </button>
        <button type="button" role="tab" data-action="switch-view" data-view-tab="insights" id="tab-insights" aria-controls="main-content" aria-selected="false" class="tab-btn tab-btn-inactive">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
          </svg>
          <span>Insights</span>
        </button>
        <button type="button" role="tab" data-action="switch-view" data-view-tab="settings" id="tab-settings" aria-controls="main-content" aria-selected="false" class="tab-btn tab-btn-inactive">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
          <span>Settings</span>
        </button>
      </div>
      <!-- Today's habits (rendered by renderHabitStrip in 03-timer.js) -->
      <div id="habit-strip" class="min-w-0 md:max-w-[55%] border-t md:border-t-0 border-[var(--border-color)]/60"></div>
      </div>
    </nav>
  </header>

  <!-- Main View Container -->
  <main id="main-content" class="app-container flex-1 py-6 w-full" tabindex="-1" aria-label="FlowBoard">
    <!-- Placeholder shown for the instant before the first screen is drawn; replaced by the active view -->
    <div class="skeleton-screen" aria-hidden="true">
      <div class="skeleton skeleton-title"></div>
      <div class="skeleton skeleton-line"></div>
      <div class="skeleton-grid">
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
      </div>
    </div>
    <p class="sr-only">Loading FlowBoard…</p>
    <noscript><p class="noscript-note">FlowBoard needs JavaScript. Please enable it in your browser and reload this page.</p></noscript>
  </main>

  <!-- Toast Notification Container -->
  <div id="toast-container" role="status" aria-live="polite"></div>

  <!-- INLINE_SCRIPT -->
</body>
</html>
