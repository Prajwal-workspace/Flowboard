  <style>/* ==========================================================================
   FLOWBOARD WORK OS - CORE STYLES & THEMES
   ========================================================================== */

/* CSS Theme Variables */
:root {
  --bg-page: #f8fafc;
  --bg-card: #ffffff;
  --bg-secondary: #f1f5f9;
  --border-color: #e2e8f0;
  --text-primary: #0f172a;
  --text-secondary: #475569; /* slate-600: 4.5:1 or better on every light surface (was #64748b) */
  --accent: #4f46e5;
  --accent-solid: #4f46e5;   /* background for white text */
  --accent-hover: #4338ca;
  --accent-light: #eef2ff;
  --ring-color: rgba(79, 70, 229, 0.4);
}

.dark {
  --bg-page: #0b0f19;
  --bg-card: #111827;
  --bg-secondary: #1f2937;
  --border-color: #374151;
  --text-primary: #f9fafb;
  --text-secondary: #9ca3af;
  --accent: #6366f1;
  --accent-solid: #4f46e5;   /* white text on #6366f1 is just under 4.5:1, so solid buttons use indigo-600 */
  --accent-hover: #4338ca;
  --accent-light: rgba(99, 102, 241, 0.15);
  --ring-color: rgba(99, 102, 241, 0.5);
}

/* Global Reset & Base */
*, *::before, *::after {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background-color: var(--bg-page);
  color: var(--text-primary);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Minimum 44px touch targets for mobile accessibility */
button, input, select, textarea, a, [role="button"], [data-action] {
  touch-action: manipulation;
}

button, [role="button"] {
  min-width: 44px;
  min-height: 44px;
  box-sizing: border-box;
}

.subtask-label {
  min-height: 44px;
  display: flex;
  align-items: center;
}

#btn-toggle-theme {
  min-width: 44px;
  min-height: 44px;
  width: 44px;
  height: 44px;
}

button:focus-visible, 
input:focus-visible, 
select:focus-visible, 
textarea:focus-visible, 
a:focus-visible,
summary:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* Visually hidden radios and checkboxes (colour pickers, day chips): show focus on the visible chip */
input.sr-only:focus-visible + span {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* The main region only receives focus from the 'Skip to content' link */
#main-content:focus {
  outline: none;
}

/* Skip link: first stop for keyboard users, hidden until focused */
.skip-link {
  position: absolute;
  left: 0.75rem;
  top: -4rem;
  z-index: 100;
  padding: 0.625rem 1rem;
  border-radius: 0.75rem;
  font-size: 0.875rem;
  font-weight: 600;
  color: #ffffff;
  background-color: var(--accent-solid);
  text-decoration: none;
}
.skip-link:focus {
  top: 0.75rem;
}

/* Header icon buttons (shortcut help) */
.header-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  border-radius: 0.75rem;
  border: 1px solid var(--border-color);
  background-color: var(--bg-card);
  color: var(--text-primary);
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  transition: background-color 150ms ease;
}
.header-icon-btn:hover {
  background-color: var(--bg-secondary);
}

/* Offline badge. Own display rules so the [hidden] attribute always wins. */
.offline-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  min-height: 32px;
  padding: 0 0.625rem;
  border-radius: 9999px;
  font-size: 0.75rem;
  font-weight: 600;
  white-space: nowrap;
  color: #92400e;
  background-color: #fef3c7;
  border: 1px solid #f59e0b;
}
.dark .offline-badge {
  color: #fcd34d;
  background-color: rgba(245, 158, 11, 0.15);
  border-color: rgba(245, 158, 11, 0.5);
}
.offline-badge[hidden] {
  display: none;
}

/* Key caps in the shortcut list */
.kbd {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 1.75rem;
  padding: 0.125rem 0.375rem;
  border-radius: 0.375rem;
  border: 1px solid var(--border-color);
  border-bottom-width: 2px;
  background-color: var(--bg-secondary);
  color: var(--text-primary);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.75rem;
  font-weight: 600;
  line-height: 1.25rem;
}

/* Welcome screen: the chosen start option is outlined (the radio itself also shows it) */
.onboard-choice:has(input:checked) {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}

.noscript-note {
  padding: 1rem;
  border: 1px solid var(--border-color);
  border-radius: 0.75rem;
}

/* Visually hidden but readable by screen readers (fallback if the Tailwind CDN is offline) */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* Planner cards are tight, so icon buttons shrink for mouse users.
   Touch screens (coarse pointer) keep the full 44px targets. */
@media (pointer: fine) {
  .planner-mini {
    min-width: 32px;
    min-height: 32px;
  }
}

/* Compact cards (Settings): tighter cards, descriptions hidden */
.compact-cards .task-card {
  padding: 0.625rem;
}
.compact-cards .task-card .task-desc {
  display: none;
}

.planner-drop-over {
  outline: 2px dashed var(--accent);
  outline-offset: -2px;
  background-color: var(--accent-light);
}

button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

/* Touch screens: every button and field is at least 44px, even where a tighter size is used for mouse */
@media (pointer: coarse) {
  button, [role="button"] {
    min-width: 44px !important;
    min-height: 44px !important;
  }
  input:not([type="checkbox"]):not([type="radio"]):not([type="range"]), select {
    min-height: 44px !important;
  }
  /* 16px text stops iPhones zooming the page when a field is tapped (pinch zoom stays available) */
  input, select, textarea {
    font-size: 16px !important;
  }
}

/* Placeholder text keeps readable contrast in both themes */
input::placeholder, textarea::placeholder {
  color: var(--text-secondary) !important;
  opacity: 1 !important;
}

/* Buttons */
.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 0.5rem 1rem;
  border-radius: 0.75rem;
  font-size: 0.875rem;
  font-weight: 600;
  color: #ffffff;
  background-color: var(--accent-solid);
  border: 1px solid transparent;
  cursor: pointer;
  transition: all 150ms cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
}

.btn-primary:hover {
  background-color: var(--accent-hover);
}

/* Small, consistent press feedback (switched off by the reduced-motion rule at the end) */
.btn-primary:active:not(:disabled),
.btn-secondary:active:not(:disabled),
.btn-icon:active:not(:disabled),
.header-icon-btn:active:not(:disabled),
.tab-btn:active {
  transform: translateY(1px);
}

.btn-secondary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 0.5rem 1rem;
  border-radius: 0.75rem;
  font-size: 0.875rem;
  font-weight: 500;
  color: var(--text-primary);
  background-color: var(--bg-card);
  border: 1px solid var(--border-color);
  cursor: pointer;
  transition: all 150ms cubic-bezier(0.4, 0, 0.2, 1);
}

.btn-secondary:hover {
  background-color: var(--bg-secondary);
  border-color: var(--text-secondary);
}

/* Icon / Tool Button (Touch-compliant) */
.btn-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  width: 44px;
  height: 44px;
  border-radius: 0.625rem;
  background-color: transparent;
  border: 1px solid transparent;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 150ms ease;
}

.btn-icon:hover {
  background-color: var(--bg-secondary);
  color: var(--text-primary);
}

/* Navigation Tabs */
.tab-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  min-height: 44px;
  padding: 0.5rem 1rem;
  font-size: 0.875rem;
  font-weight: 500;
  border-radius: 0.75rem;
  cursor: pointer;
  transition: all 150ms ease;
  white-space: nowrap;
}

.tab-btn-active {
  background-color: var(--accent-light);
  color: var(--accent);
  font-weight: 600;
}

.dark .tab-btn-active {
  background-color: rgba(99, 102, 241, 0.15);
  color: #818cf8;
}

.tab-btn-inactive {
  color: var(--text-secondary);
  background-color: transparent;
}

.tab-btn-inactive:hover {
  color: var(--text-primary);
  background-color: var(--bg-secondary);
}

/* Toast System Styling */
#toast-container {
  position: fixed;
  bottom: 1.25rem;
  right: 1.25rem;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  max-width: calc(100vw - 2.5rem);
  width: 24rem;
  pointer-events: none;
}

.toast-item {
  pointer-events: auto;
  background-color: var(--bg-card);
  color: var(--text-primary);
  border-color: var(--border-color);
}

.toast-info {
  border-left: 4px solid var(--accent);
}

.toast-success {
  border-left: 4px solid #10b981;
}

.toast-warning {
  border-left: 4px solid #f59e0b;
}

.toast-error {
  border-left: 4px solid #ef4444;
}

/* Tag Color Chips (SPEC.md: indigo, emerald, amber, rose, sky, purple) */
.tag-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  padding: 0.15rem 0.5rem;
  border-radius: 9999px;
  font-size: 0.75rem;
  font-weight: 500;
  border: 1px solid transparent;
}

.tag-indigo {
  background-color: #e0e7ff;
  color: #3730a3;
  border-color: #c7d2fe;
}
.dark .tag-indigo {
  background-color: rgba(99, 102, 241, 0.18);
  color: #a5b4fc;
  border-color: rgba(99, 102, 241, 0.35);
}

.tag-emerald {
  background-color: #d1fae5;
  color: #065f46;
  border-color: #a7f3d0;
}
.dark .tag-emerald {
  background-color: rgba(16, 185, 129, 0.18);
  color: #6ee7b7;
  border-color: rgba(16, 185, 129, 0.35);
}

.tag-amber {
  background-color: #fef3c7;
  color: #92400e;
  border-color: #fde68a;
}
.dark .tag-amber {
  background-color: rgba(245, 158, 11, 0.18);
  color: #fcd34d;
  border-color: rgba(245, 158, 11, 0.35);
}

.tag-rose {
  background-color: #ffe4e6;
  color: #9f1239;
  border-color: #fecdd3;
}
.dark .tag-rose {
  background-color: rgba(244, 63, 94, 0.18);
  color: #fda4af;
  border-color: rgba(244, 63, 94, 0.35);
}

.tag-sky {
  background-color: #e0f2fe;
  color: #0369a1;
  border-color: #bae6fd;
}
.dark .tag-sky {
  background-color: rgba(14, 165, 233, 0.18);
  color: #7dd3fc;
  border-color: rgba(14, 165, 233, 0.35);
}

.tag-purple {
  background-color: #f3e8ff;
  color: #6b21a8;
  border-color: #e9d5ff;
}
.dark .tag-purple {
  background-color: rgba(168, 85, 247, 0.18);
  color: #d8b4fe;
  border-color: rgba(168, 85, 247, 0.35);
}

/* Priority Badges */
.badge-priority {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  padding: 0.15rem 0.5rem;
  border-radius: 0.375rem;
  font-size: 0.7rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.025em;
}

.priority-urgent {
  background-color: rgba(239, 68, 68, 0.12);
  color: #b91c1c;
  border: 1px solid rgba(239, 68, 68, 0.35);
}
.dark .priority-urgent { color: #fca5a5; }

.priority-high {
  background-color: rgba(245, 158, 11, 0.15);
  color: #92400e;
  border: 1px solid rgba(245, 158, 11, 0.4);
}
.dark .priority-high { color: #fcd34d; }

.priority-medium {
  background-color: rgba(59, 130, 246, 0.12);
  color: #1d4ed8;
  border: 1px solid rgba(59, 130, 246, 0.35);
}
.dark .priority-medium { color: #93c5fd; }

.priority-low {
  background-color: rgba(100, 116, 139, 0.15);
  color: #475569;
  border: 1px solid rgba(100, 116, 139, 0.35);
}
.dark .priority-low { color: #cbd5e1; }

/* Drag and Drop Visual Feedback */
.task-card {
  cursor: grab;
  transition: transform 120ms ease, box-shadow 120ms ease, border-color 120ms ease;
}

.task-card:active {
  cursor: grabbing;
}

.task-card.is-dragging {
  opacity: 0.45;
  transform: scale(0.98);
}

.drop-indicator {
  height: 4px;
  background-color: var(--accent);
  border-radius: 9999px;
  margin: 4px 0;
  box-shadow: 0 0 8px var(--accent);
  pointer-events: none;
  transition: all 100ms ease;
}

.column-drop-zone.drag-over-column {
  background-color: var(--accent-light);
  border-color: var(--accent);
}

/* Modals */
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  background-color: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(4px);
}

.modal-dialog {
  background-color: var(--bg-card);
  color: var(--text-primary);
  border: 1px solid var(--border-color);
  border-radius: 1rem;
  box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
  width: 100%;
  max-width: 32rem;
  max-height: 90vh;
  overflow-y: auto;
  padding: 1.5rem;   /* same as the p-6 every dialog carries; keeps dialogs readable if the Tailwind CDN is unreachable */
}

/* If the Tailwind CDN is unreachable, icons would otherwise fill the page. Zero specificity, so every
   Tailwind size class still wins when it is loaded. Charts (role="img") are left alone. */
:where(svg:not([width]):not([role="img"])) {
  width: 1.25rem;
  height: 1.25rem;
}

/* Dialogs ease in (switched off by the reduced-motion rule at the end) */
@keyframes fb-fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes fb-pop-in {
  from { opacity: 0; transform: translateY(8px) scale(0.98); }
  to { opacity: 1; transform: none; }
}
.modal-backdrop {
  animation: fb-fade-in 140ms ease-out;
}
.modal-dialog {
  animation: fb-pop-in 160ms ease-out;
}

/* Loading placeholder shown before the first screen is drawn */
@keyframes fb-shimmer {
  0% { opacity: 0.55; }
  50% { opacity: 1; }
  100% { opacity: 0.55; }
}
.skeleton {
  border-radius: 0.75rem;
  background-color: var(--bg-secondary);
  border: 1px solid var(--border-color);
  animation: fb-shimmer 1.2s ease-in-out infinite;
}
.skeleton-title { height: 2rem; width: 14rem; max-width: 60%; margin-bottom: 0.75rem; }
.skeleton-line { height: 1rem; width: 22rem; max-width: 85%; margin-bottom: 1.5rem; }
.skeleton-grid {
  display: grid;
  gap: 1rem;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
}
.skeleton-card { height: 16rem; }

/* --------------------------------------------------------------------------
   CONTRAST (M7 accessibility pass)
   Several accent text colours were chosen for the dark theme and are too pale
   on light surfaces. In the light theme they are replaced by darker shades of
   the same hue (each 4.5:1 or better on white and on the tinted chips).
   The storage-recovery screen is always dark, so it keeps its own colours.
   -------------------------------------------------------------------------- */
html:not(.dark) .text-amber-500,
html:not(.dark) .text-amber-400 { color: #92400e; }
html:not(.dark) .text-emerald-500,
html:not(.dark) .text-emerald-400 { color: #065f46; }
html:not(.dark) .text-rose-500,
html:not(.dark) .text-rose-400 { color: #be123c; }
html:not(.dark) .text-red-400,
html:not(.dark) .text-red-500 { color: #b91c1c; }
html:not(.dark) .text-indigo-400,
html:not(.dark) .text-indigo-500 { color: #4338ca; }
html:not(.dark) .text-blue-400 { color: #1d4ed8; }
html:not(.dark) .text-sky-400 { color: #0369a1; }
html:not(.dark) .text-purple-400 { color: #7e22ce; }
html:not(.dark) .text-violet-400 { color: #6d28d9; }
html:not(.dark) .text-neutral-400 { color: #525252; }

#corrupted-state-modal .text-amber-400 { color: #fbbf24; }
#corrupted-state-modal .text-amber-300 { color: #fcd34d; }
#corrupted-state-modal .text-red-400 { color: #f87171; }
#corrupted-state-modal .text-red-300 { color: #fca5a5; }

/* Dark theme: three accents that sit just under 4.5:1 on tinted dark surfaces */
.dark .text-rose-500 { color: #fb7185; }
.dark .text-red-400 { color: #fca5a5; }
.dark .text-indigo-400 { color: #a5b4fc; }

/* White text on the accent colour (timer length, chosen weekday chips): use the solid accent in dark mode */
.dark .bg-\[var\(--accent\)\].text-white,
.dark .peer:checked ~ .peer-checked\:bg-\[var\(--accent\)\] {
  background-color: var(--accent-solid);
}

/* App container */
.app-container {
  max-width: 1440px;
  margin-left: auto;
  margin-right: auto;
  padding-left: 1rem;
  padding-right: 1rem;
}

/* Respect user's motion preference */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
  .btn-primary:active, .btn-secondary:active, .btn-icon:active, .header-icon-btn:active, .tab-btn:active {
    transform: none !important;
  }
}
</style>
</head>
<body class="bg-[var(--bg-page)] text-[var(--text-primary)] min-h-screen flex flex-col transition-colors duration-150">
  <a href="#main-content" class="skip-link">Skip to content</a>

  <!-- Top Command Bar -->
  <header class="lg:sticky lg:top-0 z-40 border-b border-[var(--border-color)] bg-[var(--bg-card)]/90 backdrop-blur-md transition-colors">
    <div class="app-container flex flex-wrap lg:flex-nowrap items-center justify-between gap-x-3 gap-y-2 py-2 lg:py-0 lg:min-h-[4rem]">
      <!-- Brand & Title -->
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-500/20 flex-shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
        </div>
        <div class="flex flex-col">
          <span class="font-bold text-base tracking-tight text-[var(--text-primary)] leading-tight">FlowBoard</span>
          <span class="text-[10px] text-[var(--text-secondary)] font-medium uppercase tracking-wider">Work OS</span>
        </div>
      </div>

      <!-- Focus Timer (rendered by renderTimerBar in 03-timer.js) -->
      <div id="timer-bar" class="order-last lg:order-none w-full lg:w-auto lg:flex-1 min-w-0"></div>

      <!-- Right Actions: Offline badge, Shortcut help, Theme Toggle -->
      <div class="flex items-center gap-2">

// UTILS (00-utils.js)

/**

if (typeof window !== 'undefined') {

}

/**

const APP_CHANGELOG = [

/**
 * HTML Escape Helper (XSS Protection)
 * Safely converts special characters to HTML entities.
 * @param {*} str - Input string or value to escape
 * @returns {string} Escaped string
 */
function esc(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/**
 * Get local ISO date string 'YYYY-MM-DD'
 * NOTE: Never uses toISOString().slice for local dates, preventing UTC day shift.
 * @param {Date|number|string} [d=new Date()]
 * @returns {string} 'YYYY-MM-DD'
 */
function getLocalDateString(d = new Date()) {
  const date = d instanceof Date ? d : new Date(d);
  if (isNaN(date.getTime())) return getLocalDateString(new Date());
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

/**
 * Parse local date string 'YYYY-MM-DD' into a local Date object (at midnight)
 * @param {string} dateStr - 'YYYY-MM-DD'
 * @returns {Date}
 */
function parseLocalDate(dateStr) {
  if (!dateStr || typeof dateStr !== 'string') return new Date();
  const parts = dateStr.split('-');
  if (parts.length !== 3) return new Date();
  const [y, m, d] = parts.map(Number);
  if (isNaN(y) || isNaN(m) || isNaN(d)) return new Date();
  return new Date(y, m - 1, d, 0, 0, 0, 0);
}

/**
 * Get the ISO Monday 'YYYY-MM-DD' for a given date.
 * Weeks strictly start on Monday per SPEC.md.
 * @param {Date|string} dateOrStr
 * @returns {string} Monday 'YYYY-MM-DD'
 */
function getWeekMonday(dateOrStr) {
  const date = typeof dateOrStr === 'string' ? parseLocalDate(dateOrStr) : new Date(dateOrStr);
  if (isNaN(date.getTime())) return getWeekMonday(new Date());
  const day = date.getDay(); // 0 is Sun, 1 is Mon, ... 6 is Sat
  const diff = date.getDate() - day + (day === 0 ? -6 : 1);
  const monday = new Date(date.getFullYear(), date.getMonth(), diff);
  return getLocalDateString(monday);
}

/**
 * Add (or subtract) whole calendar days to a 'YYYY-MM-DD' string.
 * Uses local calendar arithmetic, so daylight-saving changes never shift the date.
 * @param {string} dateStr
 * @param {number} n
 * @returns {string} 'YYYY-MM-DD'
 */
function addDaysStr(dateStr, n) {
  const d = parseLocalDate(dateStr);
  return getLocalDateString(new Date(d.getFullYear(), d.getMonth(), d.getDate() + n));
}

/** Weekday keys, Monday first, matching settings.capacityByWeekday */
const DAY_KEYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const DAY_KEY_BY_GETDAY = { 0: 'Sun', 1: 'Mon', 2: 'Tue', 3: 'Wed', 4: 'Thu', 5: 'Fri', 6: 'Sat' };

/** 'YYYY-MM-DD' -> 'Mon' | 'Tue' ... */
function getDayKey(dateStr) {
  return DAY_KEY_BY_GETDAY[parseLocalDate(dateStr).getDay()];
}

/**
 * Format date string for human readable display
 * @param {string} dateStr - 'YYYY-MM-DD'
 * @param {Intl.DateTimeFormatOptions} [options]
 * @returns {string}
 */
function formatDisplayDate(dateStr, options = { weekday: 'short', month: 'short', day: 'numeric' }) {
  if (!dateStr) return '';
  const date = parseLocalDate(dateStr);
  return date.toLocaleDateString(undefined, options);
}

/**
 * Generate unique ID with prefix
 * @param {string} [prefix='id']
 * @returns {string}
 */
function generateId(prefix = 'id') {
  return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).substring(2, 7)}`;
}

/**
 * Debounce helper function
 * @param {Function} fn
 * @param {number} [waitMs=300]
 * @returns {Function}
 */
function debounce(fn, waitMs = 300) {
  let timer = null;
  return function (...args) {
    if (timer) clearTimeout(timer);
    timer = setTimeout(() => {
      timer = null;
      fn.apply(this, args);
    }, waitMs);
  };
}

/**
 * Accessible Toast Notification System
 * Displays temporary message with optional action (e.g. Undo).
 * The container is a polite live region (role="status"), so ordinary toasts carry no role of
 * their own; only errors are announced assertively (role="alert").
 * The countdown pauses while the pointer or keyboard focus is on the toast.
 * @param {string} message
 * @param {Object} [options]
 * @param {number} [options.duration=4000] - Duration in ms (0 for persistent)
 * @param {string} [options.actionText] - Action button text (e.g. "Undo")
 * @param {Function} [options.onAction] - Action callback
 * @param {'info'|'success'|'warning'|'error'} [options.type='info']
 */
function showToast(message, options = {}) {
  const { duration = 4000, actionText = null, onAction = null, type = 'info' } = options;
  const container = document.getElementById('toast-container');
  if (!container) return;

  const toast = document.createElement('div');
  toast.className = `toast-item toast-${type} flex items-center justify-between gap-3 px-4 py-3 rounded-xl shadow-lg border text-sm transition-all transform duration-200 translate-y-2 opacity-0 select-none`;
  if (type === 'error') toast.setAttribute('role', 'alert');

  const textSpan = document.createElement('span');
  textSpan.className = 'font-medium';
  textSpan.textContent = message;
  toast.appendChild(textSpan);

  if (actionText && typeof onAction === 'function') {
    const actionBtn = document.createElement('button');
    actionBtn.type = 'button';
    actionBtn.className = 'px-3 py-2 text-xs font-semibold rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-400 min-h-[44px] inline-flex items-center justify-center';
    actionBtn.textContent = actionText;
    if (actionText === 'Undo') {
      // Keyboard users cannot reach a toast in time, so U presses the newest Undo (see triggerLatestUndo)
      actionBtn.setAttribute('data-toast-undo', 'true');
      actionBtn.setAttribute('aria-keyshortcuts', 'U');
      actionBtn.title = 'Undo (press U)';
    }
    actionBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      onAction();
      dismissToast(toast);
    });
    toast.appendChild(actionBtn);
  }

  const closeBtn = document.createElement('button');
  closeBtn.type = 'button';
  closeBtn.className = 'ml-1 text-[var(--text-secondary)] hover:text-[var(--text-primary)] text-lg leading-none rounded-lg min-w-[44px] min-h-[44px] flex items-center justify-center';
  closeBtn.innerHTML = '<span aria-hidden="true">&times;</span>';
  closeBtn.setAttribute('aria-label', 'Dismiss message');
  closeBtn.addEventListener('click', () => dismissToast(toast));
  toast.appendChild(closeBtn);

  container.appendChild(toast);

  // Animate in
  requestAnimationFrame(() => {
    toast.classList.remove('translate-y-2', 'opacity-0');
    toast.classList.add('translate-y-0', 'opacity-100');
  });

  if (duration > 0) {
    let remaining = duration, startedAt = 0, timerId = null;
    const start = () => {
      if (timerId) return;
      startedAt = Date.now();
      timerId = setTimeout(() => dismissToast(toast), remaining);
    };
    const pause = () => {
      if (!timerId) return;
      clearTimeout(timerId);
      timerId = null;
      remaining = Math.max(1500, remaining - (Date.now() - startedAt));
    };
    toast.addEventListener('mouseenter', pause);
    toast.addEventListener('mouseleave', start);
    toast.addEventListener('focusin', pause);
    toast.addEventListener('focusout', start);
    start();
  }
}

function dismissToast(toast) {
  if (!toast || !toast.parentNode) return;
  toast.classList.add('opacity-0', 'translate-y-2');
  setTimeout(() => {
    if (toast.parentNode) toast.remove();
  }, 220);
}

/** Press the Undo button of the newest toast that has one. Returns true if there was one. */
function triggerLatestUndo() {
  const container = document.getElementById('toast-container');
  if (!container || typeof container.querySelectorAll !== 'function') return false;
  const buttons = container.querySelectorAll('[data-toast-undo]');
  if (!buttons.length) return false;
  buttons[buttons.length - 1].click();
  return true;
}

// ----------------------------------------------------------------------------
// FOCUS HELPERS (M7)
// Re-rendering replaces the buttons on screen. These helpers describe the control that had
// keyboard focus (by id, or by its data-* attributes) and find its replacement afterwards,
// so keyboard users are not thrown back to the top of the page after every action.
// ----------------------------------------------------------------------------

/** @returns {{id:string}|{selector:string, fallback:string|null}|null} */
function describeFocusTarget(el) {
  if (!el || typeof el.getAttribute !== 'function') return null;
  if (el.id) return { id: el.id };
  const attrs = el.attributes ? Array.from(el.attributes).filter(a => a.name.indexOf('data-') === 0) : [];
  if (attrs.length === 0) return null;
  const q = v => String(v).replace(/\\/g, '\\\\').replace(/"/g, '\\"');
  const taskAttr = attrs.find(a => a.name === 'data-task-id');
  return {
    selector: String(el.tagName || '').toLowerCase() + attrs.map(a => `[${a.name}="${q(a.value)}"]`).join(''),
    fallback: taskAttr ? `[data-task-id="${q(taskAttr.value)}"]` : null
  };
}

/** Find the control described by describeFocusTarget. If it is gone or disabled, try another control of the same task. */
function findFocusTarget(desc, root = document) {
  if (!desc) return null;
  if (desc.id) return document.getElementById(desc.id);
  if (!root || typeof root.querySelector !== 'function') return null;
  let el = null;
  try { el = root.querySelector(desc.selector); } catch (e) { el = null; }
  if (el && !el.disabled) return el;
  if (!desc.fallback) return null;
  try {
    return Array.from(root.querySelectorAll(desc.fallback))
      .find(x => !x.disabled && /^(BUTTON|INPUT|SELECT|TEXTAREA|A)$/.test(String(x.tagName))) || null;
  } catch (e) {
    return null;
  }
}

function migrate(rawState) {

  let state = { ...rawState };
  const v = state.schemaVersion || 1;

  if (v < 2) {

    if (!Array.isArray(state.tags)) state.tags = [];
    if (!Array.isArray(state.tasks)) state.tasks = [];
    if (!Array.isArray(state.focusLog)) state.focusLog = [];
    if (!Array.isArray(state.dayIntentions)) state.dayIntentions = [];
    if (!Array.isArray(state.habits)) state.habits = [];
    if (!Array.isArray(state.habitLog)) state.habitLog = [];
    if (!Array.isArray(state.journalEntries)) state.journalEntries = [];
    if (!state.meta) state.meta = { lastBackupAt: 0, lastSyncAt: 0, onboarded: true };

    // Migrate tasks if needed
    state.tasks = state.tasks.map(t => {
      return {
        ...t,
        scheduledDate: t.scheduledDate || (t.day ? getLocalDateString(new Date()) : null),
        order: t.order || 1000,
        completedAt: t.completedAt || (t.status === 'done' ? Date.now() : null),
        subtasks: Array.isArray(t.subtasks) ? t.subtasks : [],
        tagIds: Array.isArray(t.tagIds) ? t.tagIds : (t.tags || [])
      };
    });
  }

  // ── v2 → v3: Areas + areaId on tasks + new ui toolbar fields ───────────────
  if (state.schemaVersion < 3) {
    state.schemaVersion = 3;
    const now3 = Date.now();

    // Seed default areas if none exist
    if (!Array.isArray(state.areas) || state.areas.length === 0) {
      state.areas = DEFAULT_AREAS.map(a => ({
        ...a,
        createdAt: now3,
        updatedAt: now3,
        deletedAt: null
      }));
    }

    // Add areaId: null to every existing task
    if (Array.isArray(state.tasks)) {
      state.tasks = state.tasks.map(t => ({
        areaId: null,
        ...t
      }));
    }

    // Patch new ui toolbar fields with defaults
    if (!state.ui) state.ui = {};
    if (state.ui.kanbanGroupBy === undefined) state.ui.kanbanGroupBy = 'none';
    if (state.ui.kanbanSortBy === undefined) state.ui.kanbanSortBy = 'manual';
    if (state.ui.kanbanFilterArea === undefined) state.ui.kanbanFilterArea = 'all';
    if (state.ui.kanbanFilterPriority === undefined) state.ui.kanbanFilterPriority = 'all';
    if (state.ui.kanbanFilterScheduled === undefined) state.ui.kanbanFilterScheduled = 'all';
    if (!state.ui.kanbanCollapsedColumns) state.ui.kanbanCollapsedColumns = {};
    if (!state.ui.kanbanCollapsedGroups) state.ui.kanbanCollapsedGroups = {};
    if (state.ui.kanbanFiltersOpen === undefined) state.ui.kanbanFiltersOpen = false;
    if (state.ui.kanbanSavedView === undefined) state.ui.kanbanSavedView = null;
  }

  // Ensure default structures exist
  const defaults = getDefaultState();
  state.settings = { ...defaults.settings, ...(state.settings || {}) };
  state.ui = { ...defaults.ui, ...(state.ui || {}) };
  state.timer = { ...defaults.timer, ...(state.timer || {}) };
  state.meta = { ...defaults.meta, ...(state.meta || {}) };
  if (!Array.isArray(state.areas)) state.areas = defaults.areas;

  return state;
}

/**
 * Safely loads state from localStorage with migration and corruption recovery
 * @returns {Object} Application state
 */
function loadState() {
  let raw = null;
  try {
    raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      // Nothing saved yet: a brand-new browser. The welcome screen (M7) shows until it is finished or skipped.
      const fresh = getDefaultState();
      fresh.meta.onboarded = false;
      saveStateImmediate(fresh);
      return fresh;
    }
    const parsed = JSON.parse(raw);
    return migrate(parsed);
  } catch (err) {
    console.error('[Storage] Error loading state from localStorage:', err);
    showCorruptedStateModal(raw, err);
    return getDefaultState();
  }
}

/**
 * Saves state to localStorage with debouncing
 */
const saveStateDebounced = debounce((stateToSave) => {
  saveStateImmediate(stateToSave);
}, 300);

/**
 * Saves state immediately (synchronously) to localStorage with error handling
 * @param {Object} stateToSave
 * @returns {boolean} Success
 */
function saveStateImmediate(stateToSave) {
  try {
    if (!stateToSave || storageRecoveryActive) return false;
    const serialized = JSON.stringify(stateToSave);
    localStorage.setItem(STORAGE_KEY, serialized);
    return true;
  } catch (err) {
    console.error('[Storage] Error saving state to localStorage:', err);
    if (err.name === 'QuotaExceededError' || err.code === 22) {
      showToast('Storage quota exceeded! Export a backup from Settings.', {
        type: 'error',
        duration: 8000,
        actionText: 'Backup',
        onAction: () => exportBackupFile(stateToSave)
      });
    } else {
      showToast('Failed to save changes locally.', { type: 'error' });
    }
    return false;
  }
}

/**
 * Master save function
 * @param {Object} stateObj
 * @param {boolean} [immediate=false]
 */
function saveState(stateObj, immediate = false) {
  if (immediate) {
    saveStateImmediate(stateObj);
  } else {
    saveStateDebounced(stateObj);
  }
}

/**
 * Downloads a state object as a JSON file
 * @param {Object|string} data
 * @param {string} [filename]
 */
function exportBackupFile(data, filename) {
  try {
    const jsonStr = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
    const blob = new Blob([jsonStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename || `flowboard_backup_${getLocalDateString(new Date())}_v${CURRENT_SCHEMA_VERSION}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    console.error('[Storage] Failed to download backup:', err);
    showToast('Failed to generate backup download.', { type: 'error' });
  }
}

/**
 * Displays the storage recovery screen.
 *
 * Real use (FlowBoard cannot read the saved data): the user can download the unreadable data,
 * or reset. Reset needs a second confirmation, and a safety copy of the unreadable data is
 * kept in localStorage so nothing is lost by a mis-click.
 *
 * Preview (options.preview, from Settings > Test): shows the same screen with no destructive
 * button at all, and can be closed.
 *
 * @param {string} rawCorruptedData
 * @param {Error} error
 * @param {{preview?: boolean}} [options]
 */
function showCorruptedStateModal(rawCorruptedData, error, options = {}) {
  const preview = Boolean(options && options.preview);
  const backupKey = STORAGE_KEY + '_corrupted_backup';

  if (!preview) storageRecoveryActive = true;
  if (!preview && rawCorruptedData) {
    try { localStorage.setItem(backupKey, rawCorruptedData); } catch (e) { /* storage may be full */ }
  }

  const previouslyFocused = document.activeElement;
  let modal = document.getElementById('corrupted-state-modal');
  if (!modal) {
    modal = document.createElement('div');
    modal.id = 'corrupted-state-modal';
    modal.className = 'fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm';
    document.body.appendChild(modal);
  }

  const close = () => {
    modal.remove();
    if (previouslyFocused && typeof previouslyFocused.focus === 'function') previouslyFocused.focus();
  };
  const download = () => exportBackupFile(
    rawCorruptedData || '{}',
    preview ? 'flowboard_recovery_preview.json' : `flowboard_corrupted_recovery_${Date.now()}.json`
  );
  const focusFirst = (id) => setTimeout(() => { const el = document.getElementById(id); if (el) el.focus(); }, 0);

  const warnIcon = `<svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
    </svg>`;

  const renderMain = () => {
    modal.innerHTML = `
      <div class="bg-neutral-900 border ${preview ? 'border-amber-500/50' : 'border-red-500/50'} rounded-2xl p-6 max-w-md w-full shadow-2xl text-neutral-100" role="alertdialog" aria-modal="true" aria-labelledby="recovery-title">
        <div class="flex items-center gap-3 mb-4 ${preview ? 'text-amber-400' : 'text-red-400'}">
          ${warnIcon}
          <h2 id="recovery-title" class="text-xl font-bold">Storage Recovery Alert${preview ? ' (preview)' : ''}</h2>
        </div>
        ${preview ? `
          <p class="text-sm text-neutral-300 mb-4 leading-relaxed">
            This is only a preview of the screen you would see if FlowBoard could not read your saved data.
            <strong class="text-amber-300">Nothing has been changed or deleted.</strong>
          </p>
          <div class="flex flex-col sm:flex-row gap-3 mt-6">
            <button type="button" id="btn-download-corrupted" class="flex-1 px-4 py-2.5 rounded-lg bg-neutral-800 hover:bg-neutral-700 text-sm font-medium border border-neutral-700 text-neutral-200 transition-colors">Download sample file</button>
            <button type="button" id="btn-close-preview" class="flex-1 px-4 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-sm font-semibold text-white transition-colors">Close preview</button>
          </div>` : `
          <p class="text-sm text-neutral-300 mb-4 leading-relaxed">
            FlowBoard could not read your saved data (${esc(error?.message || 'Invalid JSON format')}).
            Download the unreadable data first so nothing is lost, then reset to start clean.
          </p>
          <div class="flex flex-col sm:flex-row gap-3 mt-6">
            <button type="button" id="btn-download-corrupted" class="flex-1 px-4 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-sm font-semibold text-white transition-colors">Download Raw Backup</button>
            <button type="button" id="btn-reset-clean" class="flex-1 px-4 py-2.5 rounded-lg bg-neutral-800 hover:bg-neutral-700 text-sm font-medium border border-neutral-700 text-red-300 transition-colors">Reset to Clean State…</button>
          </div>`}
      </div>`;
    document.getElementById('btn-download-corrupted')?.addEventListener('click', download);
    document.getElementById('btn-close-preview')?.addEventListener('click', close);
    document.getElementById('btn-reset-clean')?.addEventListener('click', renderConfirm);
    focusFirst(preview ? 'btn-close-preview' : 'btn-download-corrupted');
  };

  // Real use only: second step before anything is deleted
  const renderConfirm = () => {
    modal.innerHTML = `
      <div class="bg-neutral-900 border border-red-500/60 rounded-2xl p-6 max-w-md w-full shadow-2xl text-neutral-100" role="alertdialog" aria-modal="true" aria-labelledby="recovery-confirm-title">
        <div class="flex items-center gap-3 mb-4 text-red-400">
          ${warnIcon}
          <h2 id="recovery-confirm-title" class="text-xl font-bold">Delete all FlowBoard data?</h2>
        </div>
        <p class="text-sm text-neutral-300 mb-4 leading-relaxed">
          This starts FlowBoard from scratch in this browser and cannot be undone. A safety copy of the unreadable data is kept in this browser,
          but please use <strong>Go back</strong> and download it first if you have not.
        </p>
        <div class="flex flex-col sm:flex-row gap-3 mt-6">
          <button type="button" id="btn-reset-back" class="flex-1 px-4 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-sm font-semibold text-white transition-colors">Go back</button>
          <button type="button" id="btn-reset-confirm" class="flex-1 px-4 py-2.5 rounded-lg bg-red-600 hover:bg-red-500 text-sm font-semibold text-white transition-colors">Yes, delete everything</button>
        </div>
      </div>`;
    document.getElementById('btn-reset-back')?.addEventListener('click', renderMain);
    document.getElementById('btn-reset-confirm')?.addEventListener('click', () => {
      try {
        localStorage.removeItem(STORAGE_KEY);   // the *_corrupted_backup copy is deliberately kept
        storageRecoveryActive = false;
        saveStateImmediate(getDefaultState());
        modal.remove();
        window.location.reload();
      } catch (e) {
        alert('Unable to clear localStorage automatically. Please clear browser storage manually.');
      }
    });
    focusFirst('btn-reset-back');
  };

  // Preview can be dismissed with Escape or by clicking outside; the real screen cannot
  modal.onkeydown = (e) => { if (preview && e.key === 'Escape') { e.preventDefault(); close(); } };
  modal.onclick = (e) => { if (preview && e.target === modal) close(); };

  renderMain();
}

// ============================================================================
// DATA PORTABILITY (M6): validate imports, CSV export, snapshots, sample data
// ============================================================================

const IMPORT_MAX_CHARS = 10 * 1024 * 1024;
const IMPORT_LIMITS = {
  tasks: 20000, tags: 500, areas: 200, habits: 500,
  habitLog: 100000, focusLog: 100000, journalEntries: 20000, dayIntentions: 20000
};
const IMPORT_KNOWN_KEYS = ['tasks', 'tags', 'areas', 'habits', 'habitLog', 'focusLog', 'journalEntries', 'dayIntentions', 'settings'];
const TASK_STATUSES = ['backlog', 'todo', 'inprogress', 'done'];
const TASK_PRIORITIES = ['urgent', 'high', 'medium', 'low'];
const TAG_COLORS = ['indigo', 'emerald', 'amber', 'rose', 'sky', 'purple'];
const AREA_COLORS = ['blue', 'emerald', 'amber', 'rose', 'sky', 'purple', 'indigo', 'violet'];

// ---- tiny sanitizers: take anything, return something safe ----
function impStr(v, max, fallback = '') {
  if (typeof v === 'string') return v.slice(0, max);
  if (typeof v === 'number' && isFinite(v)) return String(v).slice(0, max);
  return fallback;
}
function impNum(v, min, max, fallback) {
  if (v === null || v === '' || v === undefined || typeof v === 'boolean') return fallback;
  const n = Number(v);
  return isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
}
/** Whole number inside a range, otherwise the fallback (no squeezing into range) */
function impIntIn(v, min, max, fallback) {
  if (v === null || v === '' || v === undefined || typeof v === 'boolean') return fallback;
  const n = Number(v);
  return (isFinite(n) && Math.round(n) >= min && Math.round(n) <= max) ? Math.round(n) : fallback;
}
function impEnum(v, list, fallback) { return list.includes(v) ? v : fallback; }
function impBool(v, fallback) { return typeof v === 'boolean' ? v : fallback; }
function impTs(v, fallback) {
  const n = Number(v);
  return (v !== null && v !== '' && isFinite(n) && n >= 0 && n <= 8.64e15) ? Math.floor(n) : fallback;
}
function impId(v) {
  return (typeof v === 'string' && v.length >= 1 && v.length <= 80 && /^[\w.:\-]+$/.test(v)) ? v : null;
}
function impDate(v) {
  if (typeof v !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(v)) return null;
  const [y, m, d] = v.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return (dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d) ? v : null;
}

/** Short counts used to compare "what you have" with "what is in the file / snapshot" */
function summarizeState(s) {
  const live = arr => (Array.isArray(arr) ? arr : []).filter(x => x && !x.deletedAt);
  const hasContent = e => e && (e.mood != null || e.energy != null || ['wins', 'blockers', 'notes'].some(k => String(e[k] || '').trim()));
  return {
    tasks: live(s && s.tasks).length,
    tags: live(s && s.tags).length,
    areas: live(s && s.areas).length,
    habits: live(s && s.habits).length,
    journalEntries: live(s && s.journalEntries).filter(hasContent).length,
    focusMinutes: live(s && s.focusLog).reduce((a, f) => a + (Number(f.minutes) || 0), 0)
  };
}

/**
 * Check and clean backup text before it is allowed anywhere near the real data.
 * Nothing is trusted: records that cannot be read are skipped (and counted), values are
 * range-checked, text is length-capped, and references to missing items are dropped.
 * Older formats (v1, v2) are upgraded first.
 * @returns {{ok:boolean, errors:string[], warnings:string[], state:Object|null, summary:Object|null, info:Object}}
 */
function validateImportData(text) {
  const errors = [], warnings = [];
  const fail = (msg) => ({ ok: false, errors: [msg, ...errors], warnings, state: null, summary: null, info: {} });

  if (typeof text !== 'string' || text.trim() === '') return fail('The file is empty.');
  if (text.length > IMPORT_MAX_CHARS) return fail('The file is larger than 10 MB, which is too big to be a FlowBoard backup.');

  let raw;
  try { raw = JSON.parse(text); } catch (e) { return fail('This is not a valid JSON file.'); }
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return fail('This does not look like a FlowBoard backup.');
  if (!IMPORT_KNOWN_KEYS.some(k => k in raw)) return fail('This file has none of the data FlowBoard stores (tasks, tags, habits, journal...).');

  const fileVersion = Number(raw.schemaVersion) || 1;
  if (fileVersion > CURRENT_SCHEMA_VERSION) {
    return fail(`This backup was made by a newer version of FlowBoard (format v${fileVersion}). Update FlowBoard first.`);
  }
  for (const key of Object.keys(IMPORT_LIMITS)) {
    if (key in raw && raw[key] !== null && !Array.isArray(raw[key])) return fail(`"${key}" in this file is not a list, so the file is damaged.`);
    if (Array.isArray(raw[key]) && raw[key].length > IMPORT_LIMITS[key]) return fail(`The file has too many ${key} (${raw[key].length}).`);
  }

  const exportInfo = raw.exportInfo && typeof raw.exportInfo === 'object' ? raw.exportInfo : null;
  const info = {
    fileVersion,
    migrated: fileVersion < CURRENT_SCHEMA_VERSION,
    exportedAt: exportInfo && typeof exportInfo.exportedAt === 'string' ? exportInfo.exportedAt.slice(0, 40) : null,
    appVersion: exportInfo && typeof exportInfo.version === 'string' ? exportInfo.version.slice(0, 20) : null
  };

  // Upgrade old formats to the current shape, then clean everything
  let migrated;
  try {
    const copy = JSON.parse(text);
    delete copy.exportInfo;
    migrated = migrate(copy);
  } catch (e) {
    return fail('This backup could not be upgraded to the current format.');
  }

  const def = getDefaultState();
  const now = Date.now();
  const skipped = (n, what) => { if (n > 0) warnings.push(`${n} ${what} could not be read and ${n === 1 ? 'was' : 'were'} skipped.`); };
  const list = k => (Array.isArray(raw[k]) ? migratedList(k) : []);
  const migratedList = k => (Array.isArray(migrated[k]) ? migrated[k] : []);
  const stamps = r => ({ createdAt: impTs(r.createdAt, now), updatedAt: impTs(r.updatedAt, impTs(r.createdAt, now)), deletedAt: r.deletedAt ? impTs(r.deletedAt, now) : null });
  const seen = new Set();
  const unique = (id, bucket) => { const key = bucket + ':' + id; if (seen.has(key)) return false; seen.add(key); return true; };
  const isRec = r => r && typeof r === 'object' && !Array.isArray(r);

  // ---- tags ----
  let bad = 0;
  const tags = [];
  list('tags').forEach(r => {
    const id = isRec(r) ? impId(r.id) : null, name = isRec(r) ? impStr(r.name, 40).trim() : '';
    if (!id || !name || !unique(id, 'tag')) { bad++; return; }
    tags.push({ id, name, color: impEnum(r.color, TAG_COLORS, 'indigo'), ...stamps(r) });
  });
  skipped(bad, 'tags');
  const tagIdSet = new Set(tags.map(t => t.id));
  const tagByName = new Map(tags.map(t => [t.name.toLowerCase(), t.id]));
  const resolveTag = ref => {
    if (typeof ref !== 'string') return null;
    if (tagIdSet.has(ref)) return ref;
    return tagByName.get(ref.trim().toLowerCase()) || null;     // older files referred to tags by name
  };

  // ---- areas ----
  bad = 0;
  const areas = [];
  list('areas').forEach((r, i) => {
    const id = isRec(r) ? impId(r.id) : null, name = isRec(r) ? impStr(r.name, 40).trim() : '';
    if (!id || !name || !unique(id, 'area')) { bad++; return; }
    areas.push({ id, name, color: impEnum(r.color, AREA_COLORS, 'blue'), icon: impStr(r.icon, 8, '📁') || '📁', order: impNum(r.order, 0, 1e9, (i + 1) * 1000), ...stamps(r) });
  });
  skipped(bad, 'areas');
  const areaIdSet = new Set(areas.map(a => a.id));

  // ---- tasks ----
  bad = 0;
  const tasks = [];
  list('tasks').forEach((r, i) => {
    const id = isRec(r) ? impId(r.id) : null, title = isRec(r) ? impStr(r.title, 200).trim() : '';
    if (!id || !title || !unique(id, 'task')) { bad++; return; }
    const st = stamps(r);
    const status = impEnum(r.status, TASK_STATUSES, 'todo');
    const subtasks = (Array.isArray(r.subtasks) ? r.subtasks : []).slice(0, 100).map((x, j) => {
      const text = isRec(x) ? impStr(x.text, 200).trim() : '';
      return text ? { id: impId(x.id) || `st-${i}-${j}`, text, done: impBool(x.done, false) } : null;
    }).filter(Boolean);
    tasks.push({
      id, title, desc: impStr(r.desc, 5000), status,
      priority: impEnum(r.priority, TASK_PRIORITIES, 'medium'),
      tagIds: [...new Set((Array.isArray(r.tagIds) ? r.tagIds : []).map(resolveTag).filter(Boolean))],
      areaId: areaIdSet.has(r.areaId) ? r.areaId : null,
      scheduledDate: impDate(r.scheduledDate),
      estMin: Math.round(impNum(r.estMin, 0, 100000, 60)),
      order: impNum(r.order, 0, 1e12, (i + 1) * 1000),
      completedAt: status === 'done' ? impTs(r.completedAt, st.updatedAt) : null,
      subtasks, ...st
    });
  });
  skipped(bad, 'tasks');
  const taskIdSet = new Set(tasks.map(t => t.id));

  // ---- focus log ----
  bad = 0;
  const focusLog = [];
  list('focusLog').forEach(r => {
    const id = isRec(r) ? impId(r.id) : null, date = isRec(r) ? impDate(r.date) : null;
    const minutes = isRec(r) ? Math.round(impNum(r.minutes, 0, 1440, 0)) : 0;
    if (!id || !date || minutes < 1 || !unique(id, 'focus')) { bad++; return; }
    focusLog.push({ id, date, taskId: taskIdSet.has(r.taskId) ? r.taskId : null, minutes, kind: 'focus', startedAt: impTs(r.startedAt, impTs(r.createdAt, now)), ...stamps(r) });
  });
  skipped(bad, 'focus sessions');

  // ---- day intentions ----
  bad = 0;
  const dayIntentions = [];
  list('dayIntentions').forEach(r => {
    const date = isRec(r) ? impDate(r.date) : null;
    if (!date || !unique(date, 'intention')) { bad++; return; }
    dayIntentions.push({ id: `di-${date}`, date, text: impStr(r.text, 200), updatedAt: impTs(r.updatedAt, now) });
  });
  skipped(bad, 'daily intentions');

  // ---- habits (older files kept a weekly checklist in habit.days) ----
  bad = 0;
  let oldStyleHabitChecks = false;
  const DAY_TO_GETDAY = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
  const habits = [];
  list('habits').forEach(r => {
    const id = isRec(r) ? impId(r.id) : null, title = isRec(r) ? impStr(r.title, 60).trim() : '';
    if (!id || !title || !unique(id, 'habit')) { bad++; return; }
    let days = normalizeHabitDays(r.targetDays);
    if (!days && isRec(r.days)) {
      oldStyleHabitChecks = true;
      days = normalizeHabitDays(Object.keys(DAY_TO_GETDAY).filter(k => k in r.days).map(k => DAY_TO_GETDAY[k]));
    }
    habits.push({ id, title, targetDays: days || [1, 2, 3, 4, 5], archived: impBool(r.archived, false), ...stamps(r) });
  });
  skipped(bad, 'habits');
  if (oldStyleHabitChecks) warnings.push('Habit check-marks from the old weekly format have no dates, so only the habits themselves were imported.');
  const habitIdSet = new Set(habits.map(h => h.id));

  // ---- habit log ----
  bad = 0;
  const habitLogMap = new Map();
  list('habitLog').forEach(r => {
    const date = isRec(r) ? impDate(r.date) : null;
    if (!date || !habitIdSet.has(r.habitId)) { bad++; return; }
    const key = r.habitId + '|' + date;
    const entry = { id: `hl-${r.habitId}-${date}`, habitId: r.habitId, date, done: impBool(r.done, true), updatedAt: impTs(r.updatedAt, now) };
    const prev = habitLogMap.get(key);
    if (!prev || entry.updatedAt >= prev.updatedAt) habitLogMap.set(key, entry);
  });
  skipped(bad, 'habit check-ins');
  const habitLog = [...habitLogMap.values()];

  // ---- journal ----
  bad = 0;
  const journalMap = new Map();
  list('journalEntries').forEach(r => {
    const date = isRec(r) ? impDate(r.date) : null;
    if (!date) { bad++; return; }
    const entry = {
      id: `j-${date}`, date,
      mood: impIntIn(r.mood, 1, 5, null), energy: impIntIn(r.energy, 1, 10, null),
      tagId: resolveTag(r.tagId || r.tag),
      wins: impStr(r.wins, 5000), blockers: impStr(r.blockers, 5000), notes: impStr(r.notes, 5000), ...stamps(r)
    };
    const prev = journalMap.get(date);
    if (!prev || entry.updatedAt >= prev.updatedAt) journalMap.set(date, entry);
  });
  skipped(bad, 'journal entries');
  const journalEntries = [...journalMap.values()];

  // ---- settings (only known keys, range-checked) ----
  const rs = isRec(migrated.settings) ? migrated.settings : {};
  const capacityByWeekday = {};
  DAY_KEYS.forEach(k => { capacityByWeekday[k] = impNum(isRec(rs.capacityByWeekday) ? rs.capacityByWeekday[k] : undefined, 0, 16, def.settings.capacityByWeekday[k]); });
  const presets = Array.isArray(rs.timerPresets) ? rs.timerPresets.map(Number) : [];
  const presetsOk = presets.length === 4 && presets.every(n => Number.isInteger(n) && n >= 1 && n <= 600) && new Set(presets).size === 4;
  const settings = {
    ...def.settings,
    theme: impEnum(rs.theme, ['dark', 'light', 'system'], def.settings.theme),
    compactCards: impBool(rs.compactCards, false),
    soundEnabled: impBool(rs.soundEnabled, true),
    autoBackup: impBool(rs.autoBackup, true),
    dailyCapacityHours: impNum(rs.dailyCapacityHours, 0, 16, 6),
    capacityByWeekday,
    wipLimit: Math.round(impNum(rs.wipLimit, 1, 50, 3)),
    timerPresets: presetsOk ? presets : def.settings.timerPresets
  };

  // ---- assemble: fresh ui/timer/meta, this device keeps its own id ----
  const state = {
    ...def,
    schemaVersion: CURRENT_SCHEMA_VERSION,
    deviceId: (typeof getState === 'function' && getState() && getState().deviceId) || def.deviceId,
    settings,
    tags: tags.length ? tags : def.tags,
    areas: areas.length ? areas : def.areas,
    tasks, focusLog, dayIntentions, habits, habitLog, journalEntries,
    meta: { lastBackupAt: 0, lastSyncAt: 0, onboarded: true }
  };

  if ('todayFocusMinutes' in raw && fileVersion < 2) warnings.push('Old daily focus totals have no dates, so they were not imported.');
  return { ok: true, errors, warnings, state, summary: summarizeState(state), info };
}

/** One CSV cell: quotes doubled, quoted when needed, formula characters neutralised for Excel/Sheets */
function csvCell(value) {
  let v = value === null || value === undefined ? '' : String(value);
  if (/^[=+\-@\t\r]/.test(v)) v = "'" + v;
  return /[",\r\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;
}

/** All non-deleted tasks as CSV text (without the Excel BOM) */
function buildTasksCsv(s = getState()) {
  const header = ['id', 'title', 'description', 'status', 'priority', 'area', 'tags', 'scheduled_date',
    'estimated_min', 'logged_min', 'completed_at', 'subtasks_done', 'subtasks_total', 'created_at', 'updated_at'];
  const rank = { backlog: 0, todo: 1, inprogress: 2, done: 3 };
  const iso = ts => (ts ? new Date(ts).toISOString() : '');
  const rows = (s.tasks || [])
    .filter(t => !t.deletedAt)
    .sort((a, b) => (rank[a.status] ?? 9) - (rank[b.status] ?? 9) || (Number(a.order) || 0) - (Number(b.order) || 0))
    .map(t => {
      const area = t.areaId ? selectors.getAreaById(t.areaId, s) : null;
      const tagNames = (t.tagIds || []).map(id => selectors.getTagById(id, s)).filter(Boolean).map(x => x.name);
      const subs = Array.isArray(t.subtasks) ? t.subtasks : [];
      return [t.id, t.title, t.desc, t.status, t.priority, area ? area.name : '', tagNames.join('; '),
        t.scheduledDate || '', t.estMin ?? '', selectors.getTaskLoggedMinutes(t.id, s), iso(t.completedAt),
        subs.filter(x => x.done).length, subs.length, iso(t.createdAt), iso(t.updatedAt)];
    });
  return [header, ...rows].map(r => r.map(csvCell).join(',')).join('\r\n');
}

function downloadTextFile(text, filename, mime) {
  try {
    const blob = new Blob([text], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    return true;
  } catch (err) {
    console.error('[Export] Download failed:', err);
    showToast('The download could not be created.', { type: 'error' });
    return false;
  }
}

function exportTasksCsv() {
  const ok = downloadTextFile('\uFEFF' + buildTasksCsv(getState()), `flowboard_tasks_${getLocalDateString(new Date())}.csv`, 'text/csv;charset=utf-8');
  if (ok) showToast('Tasks exported as CSV', { type: 'success' });
}

/** Full JSON backup of everything, stamped with version and date. Remembers when you last did it. */
function exportFullBackup() {
  const s = getState();
  s.meta.lastBackupAt = Date.now();
  saveState(s, true);
  const payload = { ...s, exportInfo: { app: 'FlowBoard Work OS', version: APP_VERSION, exportedAt: new Date().toISOString() } };
  const ok = downloadTextFile(JSON.stringify(payload, null, 2), `flowboard_backup_${getLocalDateString(new Date())}_v${CURRENT_SCHEMA_VERSION}.json`, 'application/json');
  if (ok) showToast('Backup downloaded. Keep the file somewhere safe.', { type: 'success' });
  if (typeof safeRender === 'function') safeRender();
}

// ---------------------------------------------------------------------------
// SNAPSHOTS: automatic local copies you can restore from Settings
// ---------------------------------------------------------------------------

const SNAPSHOT_KEY = STORAGE_KEY + '_snapshots';
const SNAPSHOT_LIMITS = { daily: 7, safety: 5 };
const SNAPSHOT_LABELS = {
  daily: 'Daily', manual: 'Saved by you', 'before-import': 'Before an import', 'before-restore': 'Before a restore',
  'before-reset': 'Before Start Blank', 'before-sample': 'Before sample data'
};

function readSnapshots() {
  try {
    const parsed = JSON.parse(localStorage.getItem(SNAPSHOT_KEY) || '[]');
    return (Array.isArray(parsed) ? parsed : []).filter(x => x && typeof x.id === 'string' && typeof x.data === 'string')
      .sort((a, b) => b.createdAt - a.createdAt);
  } catch (e) {
    return [];
  }
}

function writeSnapshots(list) {
  try { localStorage.setItem(SNAPSHOT_KEY, JSON.stringify(list)); return true; } catch (e) { return false; }
}

/** Keep the newest 7 daily and the newest 5 safety copies */
function pruneSnapshots(list) {
  const out = [];
  const count = { daily: 0, safety: 0 };
  [...list].sort((a, b) => b.createdAt - a.createdAt).forEach(sn => {
    const kind = sn.kind === 'daily' ? 'daily' : 'safety';
    if (count[kind] < SNAPSHOT_LIMITS[kind]) { count[kind]++; out.push(sn); }
  });
  return out;
}

/**
 * Save a restorable copy of the current data. If the browser is short of space, the oldest
 * copies are dropped until it fits. Returns the snapshot, or null if there was no room at all.
 */
function takeSnapshot(label = 'manual', stateObj) {
  if (storageRecoveryActive) return null;
  const source = stateObj || getState();
  const now = Date.now();
  const snap = {
    id: generateId('snap'),
    kind: label === 'daily' ? 'daily' : 'safety',
    label,
    date: getLocalDateString(new Date(now)),
    createdAt: now,
    counts: summarizeState(source),
    data: JSON.stringify(source)
  };
  let list = pruneSnapshots([snap, ...readSnapshots()]);
  while (!writeSnapshots(list)) {
    if (list.length <= 1) return null;
    const oldestFirst = [...list].sort((a, b) => a.createdAt - b.createdAt).filter(x => x.id !== snap.id);
    list = list.filter(x => x.id !== oldestFirst[0].id);
  }
  return snap;
}

/** Once per day, when FlowBoard opens, copy yesterday's finished state (if automatic backups are on) */
function ensureDailySnapshot() {
  try {
    const s = getState();
    if (!s || !s.settings || s.settings.autoBackup === false || storageRecoveryActive) return null;
    const today = getLocalDateString(new Date());
    if (readSnapshots().some(x => x.kind === 'daily' && x.date === today)) return null;
    return takeSnapshot('daily', s);
  } catch (e) {
    console.error('[Snapshot] Daily backup failed:', e);
    return null;
  }
}

function deleteSnapshot(id) {
  const list = readSnapshots();
  const next = list.filter(x => x.id !== id);
  if (next.length === list.length) return false;
  return writeSnapshots(next);
}

/** How full the browser storage is. Browsers allow roughly 5 million characters per site. */
function getStorageUsage() {
  const LIMIT = 5000000;
  let appChars = 0, totalChars = 0;
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i) || '';
      const n = key.length + (localStorage.getItem(key) || '').length;
      totalChars += n;
      if (key.startsWith(STORAGE_KEY)) appChars += n;
    }
  } catch (e) { /* storage unavailable */ }
  const percent = Math.min(100, Math.round((totalChars / LIMIT) * 100));
  return { appChars, totalChars, limitChars: LIMIT, percent, level: percent >= 90 ? 'critical' : percent >= 70 ? 'warning' : 'ok' };
}

// ============================================================================
// STATE & ACTIONS & SELECTORS (02-state.js)
// ============================================================================

/**
 * Single source of truth for the application
 */
let state = null;

/**
 * Initialize state from storage
 */
function initState() {
  state = loadState();
  return state;
}

/**
 * Accessor for the active state
 * @returns {Object} Current state
 */
function getState() {
  if (!state) {
    state = loadState();
  }
  return state;
}

function safeRender() {
  if (typeof renderActiveView === 'function') {
    renderActiveView();
  }
  // Top command bar pieces (M2). Both skip the DOM update when nothing changed.
  if (typeof renderTimerBar === 'function') renderTimerBar();
  if (typeof renderHabitStrip === 'function') renderHabitStrip();
}

/**
 * Clean a list of weekdays (0 = Sunday ... 6 = Saturday, matching Date.getDay()).
 * Returns a sorted, de-duplicated array, or null if nothing valid was given.
 */
function normalizeHabitDays(days) {
  if (!Array.isArray(days)) return null;
  const clean = [...new Set(days.map(Number).filter(d => Number.isInteger(d) && d >= 0 && d <= 6))].sort((a, b) => a - b);
  return clean.length > 0 ? clean : null;
}

// ----------------------------------------------------------------------------
// ACTIONS
// Named functions: update updatedAt, call saveState(), and trigger render
// ----------------------------------------------------------------------------

const actions = {
  /**
   * Switch the active view
   * @param {'kanban'|'planner'|'journal'|'insights'|'settings'} viewName
   */
  switchView(viewName) {
    const s = getState();
    const validViews = ['kanban', 'planner', 'journal', 'insights', 'settings'];
    if (!validViews.includes(viewName)) return;

    s.ui.activeView = viewName;
    saveState(s);
    if (typeof renderAppShell === 'function') renderAppShell();
    if (typeof renderActiveView === 'function') renderActiveView();
  },

  /**
   * Set application theme
   * @param {'dark'|'light'|'system'} theme
   */
  setTheme(theme) {
    const s = getState();
    if (!['dark', 'light', 'system'].includes(theme)) return;
    s.settings.theme = theme;
    saveState(s);
    if (typeof applyCurrentTheme === 'function') applyCurrentTheme();
    if (typeof renderAppShell === 'function') renderAppShell();
    // Settings shows the chosen theme; Insights charts take their colours from it
    if ((s.ui.activeView === 'settings' || s.ui.activeView === 'insights') && typeof renderActiveView === 'function') {
      renderActiveView();
    }
  },

  // --------------------------------------------------------------------------
  // M5: INSIGHTS
  // --------------------------------------------------------------------------

  /** Choose the Insights period. Unknown values are ignored. */
  setInsightsRange(key) {
    if (!['this-week', 'last-7', 'last-30'].includes(key)) return false;
    const s = getState();
    s.ui.insightsRange = key;
    saveState(s);
    safeRender();
    return true;
  },

  /** Show or hide the data tables under the Insights charts */
  toggleInsightsTables() {
    const s = getState();
    s.ui.insightsTables = !s.ui.insightsTables;
    saveState(s);
    safeRender();
    return s.ui.insightsTables;
  },

  /**
   * Toggle between dark and light theme
   */
  toggleTheme() {
    const isCurrentlyDark = document.documentElement.classList.contains('dark');
    actions.setTheme(isCurrentlyDark ? 'light' : 'dark');
  },

  // --------------------------------------------------------------------------
  // TASK ACTIONS
  // --------------------------------------------------------------------------

  /**
   * Add a new task
   * @param {Object} taskData
   * @returns {Object} Created task
   */
  addTask(taskData = {}) {
    const s = getState();
    const status = taskData.status || 'todo';
    const now = Date.now();

    // Determine order: place at end of target column
    const existingColTasks = s.tasks.filter(t => !t.deletedAt && t.status === status);
    const maxOrder = existingColTasks.length > 0
      ? Math.max(...existingColTasks.map(t => Number(t.order) || 0))
      : 0;

    const newTask = {
      id: generateId('t'),
      title: (taskData.title || '').trim(),
      desc: (taskData.desc || '').trim(),
      status: status,
      priority: taskData.priority || 'medium', // 'urgent' | 'high' | 'medium' | 'low'
      tagIds: Array.isArray(taskData.tagIds) ? taskData.tagIds : [],
      areaId: taskData.areaId || null,
      scheduledDate: taskData.scheduledDate || null,
      estMin: Number(taskData.estMin) >= 0 ? Number(taskData.estMin) : 60,
      order: maxOrder + 1000,
      completedAt: status === 'done' ? now : null,
      subtasks: Array.isArray(taskData.subtasks)
        ? taskData.subtasks.map(st => ({
            id: st.id || generateId('st'),
            text: (st.text || '').trim(),
            done: Boolean(st.done)
          }))
        : [],
      createdAt: now,
      updatedAt: now,
      deletedAt: null
    };

    s.tasks.push(newTask);
    saveState(s);
    safeRender();
    return newTask;
  },

  /**
   * Update an existing task
   * @param {string} taskId
   * @param {Object} updates
   * @returns {Object|null} Updated task
   */
  updateTask(taskId, updates = {}) {
    const s = getState();
    const task = s.tasks.find(t => t.id === taskId);
    if (!task) return null;

    const now = Date.now();
    const oldStatus = task.status;
    const newStatus = updates.status !== undefined ? updates.status : oldStatus;

    // Handle completedAt timestamp transitions
    if (newStatus === 'done' && oldStatus !== 'done') {
      task.completedAt = now;
    } else if (newStatus !== 'done' && oldStatus === 'done') {
      task.completedAt = null;
    }

    if (updates.title !== undefined) task.title = updates.title.trim();
    if (updates.desc !== undefined) task.desc = updates.desc.trim();
    if (updates.priority !== undefined) task.priority = updates.priority;
    if (updates.status !== undefined) task.status = updates.status;
    if (updates.tagIds !== undefined) task.tagIds = updates.tagIds;
    if (updates.areaId !== undefined) task.areaId = updates.areaId || null;
    if (updates.scheduledDate !== undefined) task.scheduledDate = updates.scheduledDate || null;
    if (updates.estMin !== undefined) task.estMin = Number(updates.estMin) >= 0 ? Number(updates.estMin) : task.estMin;
    if (updates.subtasks !== undefined) {
      task.subtasks = updates.subtasks.map(st => ({
        id: st.id || generateId('st'),
        text: (st.text || '').trim(),
        done: Boolean(st.done)
      }));
    }

    task.updatedAt = now;
    saveState(s);
    safeRender();
    return task;
  },

  /**
   * Move task to a different status and optional order position
   * @param {string} taskId
   * @param {'backlog'|'todo'|'inprogress'|'done'} newStatus
   * @param {number|null} [newOrder=null]
   */
  moveTask(taskId, newStatus, newOrder = null) {
    const s = getState();
    const task = s.tasks.find(t => t.id === taskId);
    if (!task) return;

    const now = Date.now();
    const oldStatus = task.status;
    task.status = newStatus;

    // CompletedAt logic
    if (newStatus === 'done' && oldStatus !== 'done') {
      task.completedAt = now;
    } else if (newStatus !== 'done' && oldStatus === 'done') {
      task.completedAt = null;
    }

    if (newOrder !== null && typeof newOrder === 'number') {
      task.order = newOrder;
    } else {
      // Place at end of column if no order specified
      const colTasks = s.tasks.filter(t => !t.deletedAt && t.status === newStatus && t.id !== taskId);
      const maxOrder = colTasks.length > 0 ? Math.max(...colTasks.map(t => Number(t.order) || 0)) : 0;
      task.order = maxOrder + 1000;
    }

    task.updatedAt = now;
    saveState(s);
    safeRender();
  },

  /**
   * Re-normalize column order sequence
   * @param {'backlog'|'todo'|'inprogress'|'done'} status
   * @param {string[]} orderedTaskIds
   */
  reorderColumn(status, orderedTaskIds) {
    const s = getState();
    const now = Date.now();
    orderedTaskIds.forEach((id, index) => {
      const task = s.tasks.find(t => t.id === id);
      if (task) {
        task.order = (index + 1) * 1000;
        task.updatedAt = now;
      }
    });
    saveState(s);
    safeRender();
  },

  /**
   * Soft delete a task with Undo toast
   * @param {string} taskId
   */
  deleteTask(taskId) {
    const s = getState();
    const task = s.tasks.find(t => t.id === taskId);
    if (!task) return;

    const now = Date.now();
    task.deletedAt = now;
    task.updatedAt = now;
    saveState(s);
    safeRender();

    showToast('Task deleted', {
      duration: 6000,
      actionText: 'Undo',
      onAction: () => actions.restoreTask(taskId)
    });
  },

  /**
   * Restore a soft-deleted task
   * @param {string} taskId
   */
  restoreTask(taskId) {
    const s = getState();
    const task = s.tasks.find(t => t.id === taskId);
    if (!task) return;

    task.deletedAt = null;
    task.updatedAt = Date.now();
    saveState(s);
    safeRender();
    showToast('Task restored', { type: 'success' });
  },

  /**
   * Toggle completion state of a subtask
   * @param {string} taskId
   * @param {string} subtaskId
   */
  toggleSubtask(taskId, subtaskId) {
    const s = getState();
    const task = s.tasks.find(t => t.id === taskId);
    if (!task || !task.subtasks) return;

    const st = task.subtasks.find(s => s.id === subtaskId);
    if (st) {
      st.done = !st.done;
      task.updatedAt = Date.now();
      saveState(s);
      renderActiveView();
    }
  },

  // --------------------------------------------------------------------------

  /**

   */
  addTag(tagData = {}) {
    const s = getState();

    const color = validColors.includes(tagData.color) ? tagData.color : 'indigo';

    };

  deleteTag(tagId) {
    const s = getState();
    const tag = s.tags.find(t => t.id === tagId);

    const now = Date.now();
    tag.deletedAt = now;

  setActiveTagFilter(tagId) {

  /**

   */
  setSearchQuery(query) {
    const s = getState();
    s.ui.searchQuery = query || '';
    saveState(s);
    safeRender();
  },

  /**
   * Toggle Done column "Show older" state (SPEC Addition 1)
   */
  toggleShowOlderDone() {
    const s = getState();
    s.ui.showOlderDone = !s.ui.showOlderDone;

  // --------------------------------------------------------------------------
  // AREA ACTIONS (M1.1)
  // --------------------------------------------------------------------------

  /**
   * Add a new area
   * @param {Object} areaData - { name, color, icon }
   * @returns {Object|null} Created area
   */
  addArea(areaData = {}) {
    const s = getState();
    const validColors = ['blue', 'emerald', 'amber', 'rose', 'sky', 'purple', 'indigo', 'violet'];
    const color = validColors.includes(areaData.color) ? areaData.color : 'blue';
    const name = (areaData.name || '').trim();
    if (!name) return null;

    const activeAreas = (s.areas || []).filter(a => !a.deletedAt);
    const maxOrder = activeAreas.length > 0
      ? Math.max(...activeAreas.map(a => Number(a.order) || 0))
      : 0;

    const now = Date.now();
    const newArea = {
      id: generateId('area'),
      name,
      color,
      icon: (areaData.icon || '📁').trim() || '📁',
      order: maxOrder + 1000,
      createdAt: now,
      updatedAt: now,
      deletedAt: null
    };

    if (!Array.isArray(s.areas)) s.areas = [];
    s.areas.push(newArea);
    saveState(s);
    safeRender();
    return newArea;
  },

  /**
   * Update an existing area (rename, recolor, re-icon)
   * @param {string} areaId
   * @param {Object} updates - { name?, color?, icon? }
   */
  updateArea(areaId, updates = {}) {
    const s = getState();
    const area = (s.areas || []).find(a => a.id === areaId);
    if (!area) return;

    const validColors = ['blue', 'emerald', 'amber', 'rose', 'sky', 'purple', 'indigo', 'violet'];
    if (updates.name !== undefined) area.name = updates.name.trim() || area.name;
    if (updates.color !== undefined && validColors.includes(updates.color)) area.color = updates.color;
    if (updates.icon !== undefined) area.icon = updates.icon.trim() || area.icon;
    area.updatedAt = Date.now();
    saveState(s);
    safeRender();
  },

  /**
   * Reorder areas by providing an ordered list of IDs
   * @param {string[]} orderedIds
   */
  reorderAreas(orderedIds) {
    const s = getState();
    const now = Date.now();
    orderedIds.forEach((id, index) => {
      const area = (s.areas || []).find(a => a.id === id);
      if (area) {
        area.order = (index + 1) * 1000;
        area.updatedAt = now;
      }
    });
    saveState(s);
    safeRender();
  },

  /**
   * Soft delete an area with Undo toast
   * @param {string} areaId
   */
  deleteArea(areaId) {
    const s = getState();
    const area = (s.areas || []).find(a => a.id === areaId);
    if (!area) return;

    const now = Date.now();
    area.deletedAt = now;
    area.updatedAt = now;
    // If the board is currently filtered to this area, reset the filter
    if (s.ui && s.ui.kanbanFilterArea === areaId) {
      s.ui.kanbanFilterArea = 'all';
    }
    saveState(s);
    safeRender();

    showToast(`Area "${area.name}" deleted`, {
      duration: 6000,
      actionText: 'Undo',
      onAction: () => actions.restoreArea(areaId)
    });
  },

  /**
   * Restore a soft-deleted area
   * @param {string} areaId
   */
  restoreArea(areaId) {
    const s = getState();
    const area = (s.areas || []).find(a => a.id === areaId);
    if (!area) return;

    area.deletedAt = null;
    area.updatedAt = Date.now();
    saveState(s);
    safeRender();
    showToast('Area restored', { type: 'success' });
  },

  // KANBAN TOOLBAR ACTIONS (M1.1)

  setKanbanGroupBy(value) {

    saveState(s);

  setKanbanFilterPriority(priority) {

  clearKanbanFilters() {

    s.ui.kanbanGroupBy = 'none';

    s.ui.kanbanFilterArea = 'all';

  /** Toggle collapse state of a kanban column */
  toggleKanbanColumn(status) {
    const s = getState();
    if (!s.ui.kanbanCollapsedColumns) s.ui.kanbanCollapsedColumns = {};
    s.ui.kanbanCollapsedColumns[status] = !s.ui.kanbanCollapsedColumns[status];
