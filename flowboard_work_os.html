function buildSendLinesHtml(date, source) {
  const entry = selectors.getJournalEntry(date);
  const lines = parseNoteLines(entry ? entry[source] : '');
  if (lines.length === 0) {
    return `<p class="text-sm text-[var(--text-secondary)] py-2">Nothing to send in this box yet. Write one task per line. Lines starting with → were already sent.</p>`;
  }
  return `<ul class="space-y-0.5">${lines.map(l => `
    <li><label class="flex items-start gap-2.5 min-h-[44px] py-1.5 cursor-pointer">
      <input type="checkbox" name="line" value="${l.lineIndex}" checked class="mt-1 w-4 h-4" style="accent-color: var(--accent)">
      <span class="text-sm text-[var(--text-primary)] break-words">${esc(l.title)}</span>
    </label></li>`).join('')}</ul>`;
}

function openSendToKanbanModal(date) {
  const entry = selectors.getJournalEntry(date);
  // Start on the first box that actually has sendable lines
  const firstWithLines = SEND_SOURCES.find(src => parseNoteLines(entry ? entry[src.v] : '').length > 0);
  const source = firstWithLines ? firstWithLines.v : 'notes';
  const nextDay = addDaysStr(date, 1);

  const html = `
    <form id="send-kanban-form" class="modal-dialog p-6 text-[var(--text-primary)]" role="dialog" aria-modal="true" aria-labelledby="send-title">
      <div class="flex items-center justify-between mb-3">
        <h2 id="send-title" class="text-lg font-bold">Send to Kanban</h2>
        <button type="button" data-action="close-modal" class="btn-icon" aria-label="Close">&times;</button>
      </div>
      <p class="text-sm text-[var(--text-secondary)] mb-4">Each ticked line becomes a task card (30 min estimate, medium priority). You can edit them on the board.</p>

      <fieldset class="mb-3">
        <legend class="text-xs font-medium text-[var(--text-secondary)] mb-1">Take lines from</legend>
        <div class="flex flex-wrap gap-2">
          ${SEND_SOURCES.map(src => `
            <label class="inline-flex items-center gap-2 px-3 min-h-[44px] rounded-xl border border-[var(--border-color)] text-sm cursor-pointer">
              <input type="radio" name="source" value="${src.v}" ${src.v === source ? 'checked' : ''} style="accent-color: var(--accent)"> ${src.label}
            </label>`).join('')}
        </div>
      </fieldset>

      <div id="send-lines" class="max-h-[30vh] overflow-y-auto rounded-xl border border-[var(--border-color)] bg-[var(--bg-secondary)] px-3 mb-3">${buildSendLinesHtml(date, source)}</div>

      <div class="grid sm:grid-cols-2 gap-3 mb-3">
        <div>
          <label for="send-status" class="block text-xs font-medium text-[var(--text-secondary)] mb-1">Column</label>
          <select id="send-status" name="status" class="w-full px-3 min-h-[44px] rounded-xl border border-[var(--border-color)] bg-[var(--bg-card)] text-sm">
            <option value="todo">To Do</option><option value="backlog">Backlog</option>
          </select>
        </div>
        <div>
          <label for="send-schedule" class="block text-xs font-medium text-[var(--text-secondary)] mb-1">Plan for</label>
          <select id="send-schedule" name="schedule" class="w-full px-3 min-h-[44px] rounded-xl border border-[var(--border-color)] bg-[var(--bg-card)] text-sm">
            <option value="tomorrow">Tomorrow (${esc(formatDisplayDate(nextDay))})</option><option value="none">No day yet</option>
          </select>
        </div>
      </div>

      <label class="flex items-start gap-2.5 min-h-[44px] mb-4 cursor-pointer">
        <input type="checkbox" name="mark" checked class="mt-1 w-4 h-4" style="accent-color: var(--accent)">
        <span class="text-sm text-[var(--text-secondary)]">Mark sent lines with → in the note so they are not sent twice</span>
      </label>

      <div class="flex justify-end gap-2">
        <button type="button" data-action="close-modal" class="btn-secondary">Cancel</button>
        <button type="submit" id="send-submit" class="btn-primary"></button>
      </div>
    </form>`;

  openModal(html, 'input[name="source"]:checked');

  const overlay = document.getElementById('app-modal-overlay');
  if (!overlay) return;
  const form = overlay.querySelector('#send-kanban-form');
  const submitBtn = overlay.querySelector('#send-submit');

  const checkedLines = () => [...form.querySelectorAll('input[name="line"]:checked')].map(i => Number(i.value));
  const updateSubmit = () => {
    const n = checkedLines().length;
    submitBtn.textContent = n === 1 ? 'Create 1 task' : `Create ${n} tasks`;
    submitBtn.disabled = n === 0;
  };
  updateSubmit();

  overlay.onchange = (e) => {
    const el = e.target;
    if (!el || !el.name) return;
    if (el.name === 'source') {
      overlay.querySelector('#send-lines').innerHTML = buildSendLinesHtml(date, el.value);
      updateSubmit();
    } else if (el.name === 'line') {
      updateSubmit();
    }
  };

  overlay.onsubmit = (e) => {
    if (!e.target || e.target.id !== 'send-kanban-form') return;
    e.preventDefault();
    const src = form.querySelector('input[name="source"]:checked').value;
    const wanted = new Set(checkedLines());
    const current = selectors.getJournalEntry(date);
    const lines = parseNoteLines(current ? current[src] : '').filter(l => wanted.has(l.lineIndex));
    if (lines.length === 0) return;
    const status = form.elements['status'].value;
    const schedule = form.elements['schedule'].value;
    const created = actions.sendLinesToKanban({
      date, source: src, lines, status, schedule, mark: form.elements['mark'].checked
    });
    closeModal();
    showToast(
      `Created ${created} task${created === 1 ? '' : 's'} in ${status === 'backlog' ? 'Backlog' : 'To Do'}${schedule === 'tomorrow' ? `, planned for ${formatDisplayDate(nextDay)}` : ''}`,
      { type: 'success', duration: 5000 }
    );
  };
}

// ============================================================================
// VIEW: INSIGHTS (07-view-insights.js)  Milestone M5
// Four KPI cards, three Chart.js charts (each with an accessible data table),
// and plain-language diagnostics. All numbers come from the pure functions in
// `insightsSelectors`, which are unit tested without any browser or chart library.
// ============================================================================

const INSIGHT_RANGES = [
  { key: 'this-week', label: 'This week' },
  { key: 'last-7', label: 'Last 7 days' },
  { key: 'last-30', label: 'Last 30 days' }
];

const INSIGHT_STATUSES = [
  { key: 'backlog', label: 'Backlog', color: '#94a3b8' },
  { key: 'todo', label: 'To Do', color: '#38bdf8' },
  { key: 'inprogress', label: 'In Progress', color: '#f59e0b' },
  { key: 'done', label: 'Done', color: '#10b981' }
];
const INSIGHT_PRIORITIES = [
  { key: 'urgent', label: 'Urgent' },
  { key: 'high', label: 'High' },
  { key: 'medium', label: 'Medium' },
  { key: 'low', label: 'Low' }
];
const INSIGHT_TAG_COLORS = {
  indigo: '#6366f1', emerald: '#10b981', amber: '#f59e0b', rose: '#f43f5e', sky: '#0ea5e9', purple: '#a855f7'
};

let insightsCharts = [];

/** Pearson correlation of two equal-length lists, or null when it cannot be computed */
function insightsPearson(xs, ys) {
  const n = Math.min(xs.length, ys.length);
  if (n < 2) return null;
  const mx = xs.slice(0, n).reduce((a, b) => a + b, 0) / n;
  const my = ys.slice(0, n).reduce((a, b) => a + b, 0) / n;
  let sxx = 0, syy = 0, sxy = 0;
  for (let i = 0; i < n; i++) {
    const dx = xs[i] - mx, dy = ys[i] - my;
    sxx += dx * dx; syy += dy * dy; sxy += dx * dy;
  }
  if (sxx === 0 || syy === 0) return null;
  return sxy / Math.sqrt(sxx * syy);
}

const insightsSelectors = {
  /**
   * The chosen period and the one before it, as 'YYYY-MM-DD' strings (inclusive).
   * 'This week' runs Monday to today and is compared with the same days last week.
   */
  getRange(key, todayStr = getLocalDateString(new Date())) {
    const dayCount = (a, b) => Math.round((parseLocalDate(b) - parseLocalDate(a)) / 86400000) + 1;
    let start, end, prevStart, prevEnd, label, prevLabel, k = key;
    if (k === 'this-week') {
      start = getWeekMonday(todayStr); end = todayStr;
      prevStart = addDaysStr(start, -7); prevEnd = addDaysStr(end, -7);
      label = 'this week'; prevLabel = 'the same days last week';
    } else if (k === 'last-30') {
      end = todayStr; start = addDaysStr(end, -29);
      prevEnd = addDaysStr(start, -1); prevStart = addDaysStr(prevEnd, -29);
      label = 'the last 30 days'; prevLabel = 'the 30 days before';
    } else {
      k = 'last-7';
      end = todayStr; start = addDaysStr(end, -6);
      prevEnd = addDaysStr(start, -1); prevStart = addDaysStr(prevEnd, -6);
      label = 'the last 7 days'; prevLabel = 'the 7 days before';
    }
    return { key: k, start, end, prevStart, prevEnd, days: dayCount(start, end), label, prevLabel };
  },

  completedIn(start, end, s = getState()) {
    return (s?.tasks || []).filter(t => {
      if (t.deletedAt || t.status !== 'done' || !t.completedAt) return false;
      const d = getLocalDateString(new Date(t.completedAt));
      return d >= start && d <= end;
    });
  },

  focusMinutesIn(start, end, s = getState()) {
    return (s?.focusLog || [])
      .filter(f => !f.deletedAt && f.kind === 'focus' && f.date >= start && f.date <= end)
      .reduce((sum, f) => sum + (Number(f.minutes) || 0), 0);
  },

  /** Scheduled habit-days and how many were done, from when each habit began until today */
  habitStats(start, end, s = getState(), todayStr = getLocalDateString(new Date())) {
    let scheduled = 0, done = 0;
    const habits = selectors.getActiveHabits(s);
    habits.forEach(h => {
      const logDates = (s.habitLog || []).filter(l => l.habitId === h.id).map(l => l.date).sort();
      const began = [h.createdAt ? getLocalDateString(new Date(h.createdAt)) : null, logDates[0] || null].filter(Boolean).sort()[0] || start;
      let d = began > start ? began : start;
      const last = end < todayStr ? end : todayStr;
      for (let guard = 0; d <= last && guard < 800; guard++) {
        if (selectors.isHabitDue(h, d)) {
          scheduled++;
          if (selectors.isHabitDone(h.id, d, s)) done++;
        }
        d = addDaysStr(d, 1);
      }
    });
    return { scheduled, done, percent: scheduled > 0 ? Math.round((done / scheduled) * 100) : null, habitCount: habits.length };
  },

  getKpis(rangeKey, s = getState(), todayStr = getLocalDateString(new Date())) {
    const r = insightsSelectors.getRange(rangeKey, todayStr);
    const doneNow = insightsSelectors.completedIn(r.start, r.end, s);
    const donePrev = insightsSelectors.completedIn(r.prevStart, r.prevEnd, s);
    const loggedMin = insightsSelectors.focusMinutesIn(r.start, r.end, s);
    const prevLoggedMin = insightsSelectors.focusMinutesIn(r.prevStart, r.prevEnd, s);
    const estMinCompleted = doneNow.reduce((sum, t) => sum + (Number(t.estMin) || 0), 0);

    const isHigh = t => t.priority === 'urgent' || t.priority === 'high';
    const clearedHigh = doneNow.filter(isHigh).length;
    const openHigh = (s?.tasks || []).filter(t => !t.deletedAt && t.status !== 'done' && isHigh(t)).length;
    const totalHigh = clearedHigh + openHigh;

    const hNow = insightsSelectors.habitStats(r.start, r.end, s, todayStr);
    const hPrev = insightsSelectors.habitStats(r.prevStart, r.prevEnd, s, todayStr);

    return {
      range: r,
      velocity: {
        count: doneNow.length, prev: donePrev.length, delta: doneNow.length - donePrev.length,
        deltaPct: donePrev.length > 0 ? Math.round(((doneNow.length - donePrev.length) / donePrev.length) * 100) : null,
        perDay: Math.round((doneNow.length / r.days) * 10) / 10
      },
      focus: {
        loggedMin, prevLoggedMin, deltaMin: loggedMin - prevLoggedMin,
        estMinCompleted, completedCount: doneNow.length,
        perDayMin: Math.round(loggedMin / r.days)
      },
      highPriority: {
        cleared: clearedHigh, open: openHigh, total: totalHigh,
        percent: totalHigh > 0 ? Math.round((clearedHigh / totalHigh) * 100) : null
      },
      habits: {
        done: hNow.done, scheduled: hNow.scheduled, percent: hNow.percent, habitCount: hNow.habitCount,
        prevPercent: hPrev.percent,
        deltaPoints: (hNow.percent !== null && hPrev.percent !== null) ? hNow.percent - hPrev.percent : null
      }
    };
  },

  /** Focus minutes by tag. Time on a task with several tags is shared equally between them. */
  getTagEffort(rangeKey, s = getState(), todayStr = getLocalDateString(new Date())) {
    const r = insightsSelectors.getRange(rangeKey, todayStr);
    const tasksById = new Map((s?.tasks || []).map(t => [t.id, t]));
    const totals = new Map();
    const add = (key, label, color, minutes) => {
      const cur = totals.get(key) || { key, label, color, minutes: 0 };
      cur.minutes += minutes;
      totals.set(key, cur);
    };
    (s?.focusLog || []).filter(f => !f.deletedAt && f.kind === 'focus' && f.date >= r.start && f.date <= r.end).forEach(f => {
      const mins = Number(f.minutes) || 0;
      const task = f.taskId ? tasksById.get(f.taskId) : null;
      if (!task) { add('_unlinked', 'No task linked', '#6b7280', mins); return; }
      const tags = (task.tagIds || []).map(id => selectors.getTagById(id, s)).filter(Boolean);
      if (tags.length === 0) { add('_none', 'No tag', '#9ca3af', mins); return; }
      tags.forEach(tag => add(tag.id, tag.name, INSIGHT_TAG_COLORS[tag.color] || '#6366f1', mins / tags.length));
    });
    // Shared time can be fractional (22.5 + 22.5). Round with "largest remainder" so the parts always add up to the true total.
    const parts = [...totals.values()].map(x => ({ ...x, exact: x.minutes, minutes: Math.floor(x.minutes + 1e-9) }));
    let remaining = Math.round(parts.reduce((a, x) => a + x.exact, 0)) - parts.reduce((a, x) => a + x.minutes, 0);
    parts.slice()
      .sort((a, b) => ((b.exact - b.minutes) - (a.exact - a.minutes)) || (b.exact - a.exact))
      .forEach(x => { if (remaining > 0) { x.minutes++; remaining--; } });
    return parts.filter(x => x.minutes > 0)
      .map(({ exact, ...rest }) => rest)
      .sort((a, b) => b.minutes - a.minutes || a.label.localeCompare(b.label));
  },

  /** Tasks by priority and stage. Done only counts what was finished in the chosen period. */
  getPriorityPipeline(rangeKey, s = getState(), todayStr = getLocalDateString(new Date())) {
    const r = insightsSelectors.getRange(rangeKey, todayStr);
    const matrix = {};
    INSIGHT_STATUSES.forEach(st => { matrix[st.key] = {}; INSIGHT_PRIORITIES.forEach(p => { matrix[st.key][p.key] = 0; }); });
    let total = 0;
    (s?.tasks || []).filter(t => !t.deletedAt).forEach(t => {
      if (!matrix[t.status] || matrix[t.status][t.priority] === undefined) return;
      if (t.status === 'done') {
        const d = t.completedAt ? getLocalDateString(new Date(t.completedAt)) : null;
        if (!d || d < r.start || d > r.end) return;
      }
      matrix[t.status][t.priority]++;
      total++;
    });
    return { matrix, total, range: r };
  },

  /** Planned (estimates of tasks scheduled that week) vs logged focus minutes, last N weeks */
  getWeeklyPlannedVsLogged(weeks = 8, s = getState(), todayStr = getLocalDateString(new Date())) {
    const thisMonday = getWeekMonday(todayStr);
    const out = [];
    for (let i = weeks - 1; i >= 0; i--) {
      const start = addDaysStr(thisMonday, -7 * i), end = addDaysStr(start, 6);
      const plannedMin = (s?.tasks || [])
        .filter(t => !t.deletedAt && t.scheduledDate && t.scheduledDate >= start && t.scheduledDate <= end)
        .reduce((sum, t) => sum + (Number(t.estMin) || 0), 0);
      out.push({ weekStart: start, label: formatDisplayDate(start, { day: 'numeric', month: 'short' }), plannedMin, loggedMin: insightsSelectors.focusMinutesIn(start, end, s) });
    }
    return out;
  },

  /** Plain-language observations, most important first */
  getDiagnostics(rangeKey, s = getState(), todayStr = getLocalDateString(new Date())) {
    const r = insightsSelectors.getRange(rangeKey, todayStr);
    const tasks = (s?.tasks || []).filter(t => !t.deletedAt);
    const out = [];

    const wipLimit = Number(s?.settings?.wipLimit) || 3;
    const wip = tasks.filter(t => t.status === 'inprogress').length;
    if (wip > wipLimit) out.push({ id: 'wip', level: 'warn', title: `${wip} tasks are in progress (your limit is ${wipLimit})`, detail: 'Too many open tasks slows everything down. Finish one, or move something back to To Do, before starting more.', action: { label: 'Open the board', view: 'kanban' } });

    const overdue = selectors.getCarryOverTasks(todayStr, s);
    if (overdue.length > 0) out.push({ id: 'overdue', level: 'warn', title: `${overdue.length} unfinished task${overdue.length > 1 ? 's' : ''} from earlier days`, detail: 'They are still planned for a day that has passed. Move them to today or take them off the plan.', action: { label: 'Open the planner', view: 'planner' } });

    const noDay = tasks.filter(t => !t.scheduledDate && (t.status === 'todo' || t.status === 'inprogress')).length;
    if (noDay > 0) out.push({ id: 'unscheduled', level: noDay > 3 ? 'warn' : 'info', title: `${noDay} active task${noDay > 1 ? 's have' : ' has'} no day planned`, detail: 'Tasks without a day tend to slip. Give each one a day in the planner.', action: { label: 'Open the planner', view: 'planner' } });

    const logged = t => selectors.getTaskLoggedMinutes(t.id, s);
    const measured = insightsSelectors.completedIn(r.start, r.end, s).filter(t => (Number(t.estMin) || 0) > 0 && logged(t) > 0);
    if (measured.length >= 3) {
      const est = measured.reduce((a, t) => a + t.estMin, 0), act = measured.reduce((a, t) => a + logged(t), 0);
      const ratio = act / est;
      const over = measured.filter(t => logged(t) > t.estMin * 1.5 && logged(t) - t.estMin >= 15).length;
      if (ratio > 1.25) out.push({ id: 'estimates', level: 'warn', title: `Tasks are taking about ${Math.round(ratio * 100)}% of their estimate`, detail: `${over ? `${over} of ${measured.length} finished tasks ran well over. ` : ''}Try padding your estimates, or splitting big tasks into smaller steps.` });
      else if (ratio < 0.75) out.push({ id: 'estimates', level: 'info', title: `Tasks are finishing in about ${Math.round(ratio * 100)}% of their estimate`, detail: 'You are estimating high. Tighter estimates will make the planner\'s load bars more honest.' });
    }

    // Does energy track focus? last 30 days, same day
    const xs = [], ys = [];
    for (let i = 0; i < 30; i++) {
      const d = addDaysStr(todayStr, -i);
      const e = selectors.getJournalEntry(d, s);
      if (e && e.energy != null) { xs.push(e.energy); ys.push(insightsSelectors.focusMinutesIn(d, d, s)); }
    }
    if (xs.length < 5) {
      out.push({ id: 'energy', level: 'info', title: 'Energy and focus: not enough data yet', detail: `Rate your energy in the journal on at least 5 days (${xs.length} so far) and FlowBoard will show whether it affects your focus time.`, action: { label: 'Open the journal', view: 'journal' } });
    } else {
      const rr = insightsPearson(xs, ys);
      if (rr === null) out.push({ id: 'energy', level: 'info', title: 'Energy and focus: no pattern to measure yet', detail: 'Either your energy or your logged focus time is the same every day so far.' });
      else if (rr >= 0.4) out.push({ id: 'energy', level: 'info', title: 'You focus more on high-energy days', detail: `Over ${xs.length} journal days, higher energy goes with more focus time (correlation ${rr.toFixed(2)}). Put your hardest work on the days and hours you feel best.` });
      else if (rr <= -0.4) out.push({ id: 'energy', level: 'info', title: 'You focus more on low-energy days', detail: `Over ${xs.length} journal days, lower energy goes with more focus time (correlation ${rr.toFixed(2)}). You may be pushing through tiredness, so watch for burnout.` });
      else out.push({ id: 'energy', level: 'info', title: 'No clear link between energy and focus yet', detail: `Over ${xs.length} journal days the two do not move together (correlation ${rr.toFixed(2)}).` });
    }

    if (out.every(x => x.level === 'info')) {
      out.unshift({ id: 'healthy', level: 'good', title: 'The board looks healthy', detail: 'No overloaded In Progress column and nothing overdue.' });
    }
    const rank = { warn: 0, good: 1, info: 2 };
    return out.sort((a, b) => rank[a.level] - rank[b.level]);
  }
};

// ----------------------------------------------------------------------------
// CHART CONFIGS (pure: data in, Chart.js config out; tested without Chart.js)
// ----------------------------------------------------------------------------

function insightsChartTheme() {
  const dark = selectors.getEffectiveTheme() === 'dark';
  return dark
    ? { text: '#9ca3af', strong: '#f9fafb', grid: 'rgba(255,255,255,0.08)', surface: '#111827' }
    : { text: '#475569', strong: '#0f172a', grid: 'rgba(15,23,42,0.08)', surface: '#ffffff' };
}

function insightsReduceMotion() {
  try { return Boolean(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { return false; }
}

function buildTagChartConfig(tagEffort, theme) {
  const total = tagEffort.reduce((a, x) => a + x.minutes, 0);
  return {
    type: 'doughnut',
    data: {
      labels: tagEffort.map(x => x.label),
      datasets: [{ data: tagEffort.map(x => x.minutes), backgroundColor: tagEffort.map(x => x.color), borderColor: theme.surface, borderWidth: 2 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '62%',
      animation: { duration: insightsReduceMotion() ? 0 : 400 },
      plugins: {
        legend: { position: 'bottom', labels: { color: theme.text, boxWidth: 12, padding: 12 } },
        tooltip: { callbacks: { label: ctx => ` ${ctx.label}: ${formatMinutes(ctx.parsed)} (${total ? Math.round((ctx.parsed / total) * 100) : 0}%)` } }
      }
    }
  };
}

function buildPipelineChartConfig(pipeline, theme) {
  return {
    type: 'bar',
    data: {
      labels: INSIGHT_PRIORITIES.map(p => p.label),
      datasets: INSIGHT_STATUSES.map(st => ({
        label: st.label, backgroundColor: st.color, borderRadius: 3,
        data: INSIGHT_PRIORITIES.map(p => pipeline.matrix[st.key][p.key])
      }))
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      animation: { duration: insightsReduceMotion() ? 0 : 400 },
      scales: {
        x: { stacked: true, ticks: { color: theme.text }, grid: { display: false } },
        y: { stacked: true, beginAtZero: true, ticks: { color: theme.text, precision: 0 }, grid: { color: theme.grid }, title: { display: true, text: 'Tasks', color: theme.text } }
      },
      plugins: { legend: { position: 'bottom', labels: { color: theme.text, boxWidth: 12, padding: 12 } } }
    }
  };
}

function buildWeeklyChartConfig(weeks, theme) {
  return {
    type: 'bar',
    data: {
      labels: weeks.map(w => w.label),
      datasets: [
        { label: 'Planned', data: weeks.map(w => w.plannedMin), backgroundColor: '#818cf8', borderRadius: 3 },
        { label: 'Logged', data: weeks.map(w => w.loggedMin), backgroundColor: '#34d399', borderRadius: 3 }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      animation: { duration: insightsReduceMotion() ? 0 : 400 },
      scales: {
        x: { ticks: { color: theme.text }, grid: { display: false }, title: { display: true, text: 'Week starting', color: theme.text } },
        y: { beginAtZero: true, ticks: { color: theme.text, callback: v => formatMinutes(v) }, grid: { color: theme.grid }, title: { display: true, text: 'Time', color: theme.text } }
      },
      plugins: {
        legend: { position: 'bottom', labels: { color: theme.text, boxWidth: 12, padding: 12 } },
        tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}: ${formatMinutes(ctx.parsed.y)}` } }
      }
    }
  };
}

function destroyInsightsCharts() {
  insightsCharts.forEach(c => { try { c.destroy(); } catch (e) { /* already gone */ } });
  insightsCharts = [];
}

function insightsDelta(n, unit, bigger = 'more', smaller = 'fewer') {
  if (n === 0) return { text: 'No change', arrow: '–', cls: 'text-[var(--text-secondary)]' };
  return n > 0
    ? { text: `${n} ${bigger}${unit ? ' ' + unit : ''}`, arrow: '▲', cls: 'text-emerald-500' }
    : { text: `${Math.abs(n)} ${smaller}${unit ? ' ' + unit : ''}`, arrow: '▼', cls: 'text-rose-500' };
}

function insightsKpiCard(id, label, valueHtml, lines) {
  return `
    <div class="rounded-2xl border border-[var(--border-color)] bg-[var(--bg-card)] p-5" role="group" aria-labelledby="${id}-label">
      <span id="${id}-label" class="text-xs font-medium text-[var(--text-secondary)] uppercase tracking-wider">${esc(label)}</span>
      <div class="text-3xl font-bold text-[var(--text-primary)] mt-1.5 leading-tight">${valueHtml}</div>
      ${lines.map(l => `<p class="text-sm mt-1 ${l.cls || 'text-[var(--text-secondary)]'}">${l.html}</p>`).join('')}
    </div>`;
}

function insightsTable(caption, headers, rows, visible) {
  return `
    <div class="${visible ? 'mt-3 overflow-x-auto' : 'sr-only'}">
      <table class="w-full text-sm">
        <caption class="text-left text-xs text-[var(--text-secondary)] pb-1">${esc(caption)}</caption>
        <thead><tr>${headers.map((h, i) => `<th scope="col" class="py-1 ${i ? 'text-right pl-3' : 'text-left'} text-xs font-medium text-[var(--text-secondary)]">${esc(h)}</th>`).join('')}</tr></thead>
        <tbody>${rows.map(r => `<tr class="border-t border-[var(--border-color)]">${r.map((c, i) => i === 0
          ? `<th scope="row" class="py-1 text-left font-normal text-[var(--text-primary)]">${esc(c)}</th>`
          : `<td class="py-1 pl-3 text-right font-mono text-[var(--text-primary)]">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody>
      </table>
    </div>`;
}

function insightsChartCard({ id, title, subtitle, hasData, emptyText, chartAvailable, label, tableHtml, wide }) {
  return `
    <section class="rounded-2xl border border-[var(--border-color)] bg-[var(--bg-card)] p-5 ${wide ? 'lg:col-span-2' : ''}" aria-labelledby="${id}-title">
      <h3 id="${id}-title" class="text-sm font-semibold text-[var(--text-primary)]">${esc(title)}</h3>
      <p class="text-xs text-[var(--text-secondary)] mt-0.5 mb-3">${esc(subtitle)}</p>
      ${hasData
        ? (chartAvailable
          ? `<div class="relative h-64"><canvas id="${id}" role="img" aria-label="${esc(label)}">${esc(label)}</canvas></div>`
          : `<p class="text-sm text-[var(--text-secondary)] py-6">The chart library could not load (you may be offline). The table shows the same numbers.</p>`)
        : `<p class="text-sm text-[var(--text-secondary)] py-10 text-center">${esc(emptyText)}</p>`}
      ${tableHtml}
    </section>`;
}

/**
 * Render the Insights & Analytics view
 * @param {HTMLElement} container
 */
function renderInsightsView(container) {
  destroyInsightsCharts();
  const s = getState();
  const today = getLocalDateString(new Date());
  const rangeKey = (s.ui && s.ui.insightsRange) || 'last-7';
  const showTables = Boolean(s.ui && s.ui.insightsTables);
  const kpis = insightsSelectors.getKpis(rangeKey, s, today);
  const r = kpis.range;
  const tagEffort = insightsSelectors.getTagEffort(rangeKey, s, today);
  const pipeline = insightsSelectors.getPriorityPipeline(rangeKey, s, today);
  const weeks = insightsSelectors.getWeeklyPlannedVsLogged(8, s, today);
  const diagnostics = insightsSelectors.getDiagnostics(rangeKey, s, today);
  const chartAvailable = typeof Chart !== 'undefined';
  const tablesVisible = showTables || !chartAvailable;
  const theme = insightsChartTheme();

  const nothingYet = (s.tasks || []).filter(t => !t.deletedAt).length === 0 && (s.focusLog || []).length === 0 && (s.habitLog || []).length === 0;

  // ---- KPI cards ----
  const vel = kpis.velocity, dv = insightsDelta(vel.delta, 'task' + (Math.abs(vel.delta) === 1 ? '' : 's'));
  const fo = kpis.focus, df = insightsDelta(Math.round(fo.deltaMin / 6) / 10, 'h', 'more', 'less');
  const hp = kpis.highPriority, hb = kpis.habits;
  const dh = hb.deltaPoints === null ? null : insightsDelta(hb.deltaPoints, 'points', 'higher', 'lower');
  const cards = [
    insightsKpiCard('kpi-velocity', 'Completion velocity',
      `${vel.count} <span class="text-base font-medium text-[var(--text-secondary)]">task${vel.count === 1 ? '' : 's'} done</span>`,
      [{ html: `<span aria-hidden="true">${dv.arrow}</span> <span class="font-semibold">${esc(dv.text)}</span> than ${esc(r.prevLabel)} (${vel.prev})`, cls: dv.cls },
       { html: `${vel.perDay} per day${vel.deltaPct !== null ? ` · ${vel.deltaPct > 0 ? '+' : ''}${vel.deltaPct}%` : ''}` }]),
    insightsKpiCard('kpi-focus', 'Focus time',
      `${esc(formatMinutes(fo.loggedMin))} <span class="text-base font-medium text-[var(--text-secondary)]">logged</span>`,
      [{ html: `<span aria-hidden="true">${df.arrow}</span> <span class="font-semibold">${esc(df.text)}</span> than ${esc(r.prevLabel)}`, cls: df.cls },
       { html: fo.completedCount > 0 ? `Tasks you finished were estimated at <strong class="text-[var(--text-primary)]">${esc(formatMinutes(fo.estMinCompleted))}</strong>` : 'Finish a task to compare against estimates' }]),
    insightsKpiCard('kpi-high', 'High priority cleared',
      hp.total > 0 ? `${hp.cleared} <span class="text-base font-medium text-[var(--text-secondary)]">of ${hp.total}${hp.percent !== null ? ` (${hp.percent}%)` : ''}</span>` : `<span class="text-xl font-semibold text-[var(--text-secondary)]">None yet</span>`,
      [{ html: hp.total > 0 ? `${hp.open} urgent or high task${hp.open === 1 ? '' : 's'} still open` : 'No urgent or high-priority tasks to clear' }]),
    insightsKpiCard('kpi-habits', 'Habit consistency',
      hb.percent === null ? `<span class="text-xl font-semibold text-[var(--text-secondary)]">No data</span>` : `${hb.percent}<span class="text-base font-medium text-[var(--text-secondary)]">%</span>`,
      [{ html: hb.scheduled > 0 ? `${hb.done} of ${hb.scheduled} scheduled check-ins` : (hb.habitCount ? 'No habit days scheduled in this period yet' : 'Add a habit to track consistency') },
       ...(dh ? [{ html: `<span aria-hidden="true">${dh.arrow}</span> <span class="font-semibold">${esc(dh.text)}</span> than ${esc(r.prevLabel)}`, cls: dh.cls }] : [])])
  ].join('');

  // ---- diagnostics ----
  const diagIcon = { warn: '⚠', info: 'ℹ', good: '✓' };
  const diagStyle = { warn: 'border-amber-500/40 bg-amber-500/10', good: 'border-emerald-500/40 bg-emerald-500/10', info: 'border-[var(--border-color)] bg-[var(--bg-secondary)]' };
  const diagLabel = { warn: 'Needs attention', good: 'Good', info: 'Note' };
  const diagHtml = diagnostics.map(d => `
    <li class="flex flex-wrap items-start justify-between gap-3 p-3 rounded-xl border ${diagStyle[d.level]}">
      <div class="min-w-0 flex-1">
        <p class="text-sm font-semibold text-[var(--text-primary)]"><span aria-hidden="true">${diagIcon[d.level]}</span> <span class="sr-only">${diagLabel[d.level]}: </span>${esc(d.title)}</p>
        <p class="text-sm text-[var(--text-secondary)] mt-0.5">${esc(d.detail)}</p>
      </div>
      ${d.action ? `<button type="button" data-action="switch-view" data-view-tab="${esc(d.action.view)}" class="btn-secondary text-xs flex-shrink-0">${esc(d.action.label)}</button>` : ''}
    </li>`).join('');

  // ---- chart cards ----
  const tagTotal = tagEffort.reduce((a, x) => a + x.minutes, 0);
  const pipeTotals = INSIGHT_PRIORITIES.map(p => INSIGHT_STATUSES.map(st => pipeline.matrix[st.key][p.key]));
  const weeksHaveData = weeks.some(w => w.plannedMin > 0 || w.loggedMin > 0);
  const tagLabel = tagTotal ? `Doughnut chart of focus time by tag: ${tagEffort.map(x => `${x.label} ${formatMinutes(x.minutes)}`).join(', ')}.` : 'No focus time logged.';
  const pipeLabel = pipeline.total ? `Stacked bar chart of ${pipeline.total} tasks by priority and stage.` : 'No tasks.';
  const weekLabel = weeksHaveData ? `Bar chart comparing planned and logged time for each of the last 8 weeks.` : 'No planned or logged time.';

  const chartsHtml = [
    insightsChartCard({
      id: 'chart-tags', title: 'Where your focus time went', subtitle: `Minutes logged by tag, ${r.label}`,
      hasData: tagTotal > 0, emptyText: 'No focus time logged in this period. Start the timer on a task and your time will show up here.',
      chartAvailable, label: tagLabel,
      tableHtml: insightsTable('Focus time by tag', ['Tag', 'Time', 'Share'], tagEffort.map(x => [x.label, formatMinutes(x.minutes), `${Math.round((x.minutes / tagTotal) * 100)}%`]), tablesVisible)
    }),
    insightsChartCard({
      id: 'chart-pipeline', title: 'Priority pipeline', subtitle: `Tasks by priority and stage (Done = finished in ${r.label})`,
      hasData: pipeline.total > 0, emptyText: 'No tasks yet. Add some on the Kanban board.',
      chartAvailable, label: pipeLabel,
      tableHtml: insightsTable('Tasks by priority and stage', ['Priority', ...INSIGHT_STATUSES.map(x => x.label)], INSIGHT_PRIORITIES.map((p, i) => [p.label, ...pipeTotals[i]]), tablesVisible)
    }),
    insightsChartCard({
      id: 'chart-weekly', title: 'Planned vs logged, week by week', subtitle: 'Estimated minutes of tasks planned for each week against focus time logged (last 8 weeks)',
      hasData: weeksHaveData, emptyText: 'Plan some tasks in the Weekly Planner and log focus time to compare them here.',
      chartAvailable, label: weekLabel, wide: true,
      tableHtml: insightsTable('Planned and logged time per week', ['Week starting', 'Planned', 'Logged'], weeks.map(w => [w.label, formatMinutes(w.plannedMin), formatMinutes(w.loggedMin)]), tablesVisible)
    })
  ].join('');

  container.innerHTML = `
    <div class="space-y-6">
      <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-3">
        <div>
          <h1 class="text-2xl font-bold tracking-tight text-[var(--text-primary)]">Insights &amp; Analytics</h1>
          <p class="text-sm text-[var(--text-secondary)] mt-0.5">${esc(formatDisplayDate(r.start))} to ${esc(formatDisplayDate(r.end))}, compared with ${esc(r.prevLabel)}</p>
        </div>
        <div class="inline-flex p-1 rounded-xl bg-[var(--bg-secondary)] border border-[var(--border-color)]" role="group" aria-label="Time period">
          ${INSIGHT_RANGES.map(x => `<button type="button" data-action="insights-range" data-range="${x.key}" aria-pressed="${x.key === r.key}"
            class="px-4 py-2 min-h-[44px] text-sm font-medium rounded-lg transition-all ${x.key === r.key ? 'bg-indigo-600 text-white shadow-sm' : 'text-[var(--text-secondary)] hover:text-[var(--text-primary)]'}">${esc(x.label)}</button>`).join('')}
        </div>
      </div>

      ${nothingYet ? `<div class="p-4 rounded-xl border border-indigo-500/40 bg-indigo-600/10 text-sm text-[var(--text-primary)]">
        <p class="font-semibold">Nothing to analyse yet</p>
        <p class="text-[var(--text-secondary)] mt-0.5">Complete a task, run the focus timer or tick a habit and this page fills in. Want to look around first? Load the sample workspace from Settings.</p>
        <button type="button" data-action="switch-view" data-view-tab="settings" class="btn-secondary text-xs mt-2">Open Settings</button>
      </div>` : ''}

      <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">${cards}</div>

      <section aria-labelledby="insights-notes-title">
        <h2 id="insights-notes-title" class="text-sm font-semibold text-[var(--text-primary)] mb-2">What to look at</h2>
        <ul class="space-y-2">${diagHtml}</ul>
      </section>

      <section aria-labelledby="insights-charts-title">
        <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
          <h2 id="insights-charts-title" class="text-sm font-semibold text-[var(--text-primary)]">Charts</h2>
          <button type="button" data-action="insights-toggle-tables" aria-pressed="${tablesVisible}" ${chartAvailable ? '' : 'disabled'} class="btn-secondary text-xs">${tablesVisible ? 'Hide data tables' : 'Show data as tables'}</button>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">${chartsHtml}</div>
      </section>
    </div>
  `;

  mountInsightsCharts({ tagEffort, pipeline, weeks, theme, tagTotal, weeksHaveData });
}

/** Draw the charts. If the chart library did not load, the tables already hold the numbers. */
function mountInsightsCharts({ tagEffort, pipeline, weeks, theme, tagTotal, weeksHaveData }) {
  if (typeof Chart === 'undefined') return false;
  try {
    if (Chart.defaults && Chart.defaults.font) Chart.defaults.font.family = "Inter, -apple-system, 'Segoe UI', Roboto, sans-serif";
  } catch (e) { /* cosmetic only */ }
  const jobs = [
    ['chart-tags', tagTotal > 0 ? buildTagChartConfig(tagEffort, theme) : null],
    ['chart-pipeline', pipeline.total > 0 ? buildPipelineChartConfig(pipeline, theme) : null],
    ['chart-weekly', weeksHaveData ? buildWeeklyChartConfig(weeks, theme) : null]
  ];
  jobs.forEach(([id, config]) => {
    const canvas = document.getElementById(id);
    if (!canvas || !config) return;
    try {
      insightsCharts.push(new Chart(canvas, config));
    } catch (e) {
      console.error('[Insights] Could not draw chart', id, e);
      const holder = canvas.parentElement;
      if (holder) holder.innerHTML = '<p class="text-sm text-[var(--text-secondary)] py-6">This chart could not be drawn. The table shows the same numbers.</p>';
    }
  });
  return true;
}

  return `

        <span class="relative inline-block h-7 w-12 rounded-full transition-colors ${checked ? 'bg-[var(--accent)]' : 'bg-neutral-500/60'}">

        </span>
      </button>
    </div>`;
}

function settingsAgo(ts) {
  if (!ts) return null;
  const days = Math.floor((Date.now() - ts) / 86400000);
  return days <= 0 ? 'today' : days === 1 ? 'yesterday' : `${days} days ago`;
}

function settingsTime(ts) {
  return new Date(ts).toLocaleString(undefined, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}

/** Show what an import would replace, and only replace after the user confirms */
function openImportPreviewModal(result, filename) {
  const cur = summarizeState(getState());
  const when = result.info.exportedAt ? new Date(result.info.exportedAt) : null;
  const html = settingsDialog({
    formId: 'import-confirm-form', titleId: 'import-title', title: 'Replace your data with this backup?',
    confirmLabel: 'Replace my data', confirmId: 'import-confirm-btn', danger: true,
    body: `
      <p class="text-sm text-[var(--text-secondary)] mb-3">
        <strong class="text-[var(--text-primary)]">${esc(filename || 'Backup file')}</strong>${when && !isNaN(when) ? `, saved ${esc(when.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }))}` : ''}${result.info.appVersion ? ` by FlowBoard v${esc(result.info.appVersion)}` : ''}.
        ${result.info.migrated ? `It is in an older format (v${result.info.fileVersion}) and will be upgraded.` : ''}
      </p>
      ${settingsCompareTable(cur, result.summary, 'In the file')}
      ${result.warnings.length ? `<div class="mb-3 p-3 rounded-xl border border-amber-500/40 bg-amber-500/10 text-sm"><p class="font-semibold text-amber-500 mb-1">Heads up</p><ul class="list-disc pl-5 space-y-0.5 text-[var(--text-primary)]">${result.warnings.map(w => `<li>${esc(w)}</li>`).join('')}</ul></div>` : ''}
      <p class="text-sm text-[var(--text-secondary)]">Everything you have now is replaced. A backup copy of your current data is saved first, and you can undo for 15 seconds. Your settings come from the file.</p>`
  });
  openModal(html, '[data-action="close-modal"]');
  const overlay = document.getElementById('app-modal-overlay');
  if (!overlay) return;
  overlay.onsubmit = (e) => {
    if (!e.target || e.target.id !== 'import-confirm-form') return;
    e.preventDefault();
    const undoId = actions.replaceAllData(result.state, 'import');
    closeModal();
    if (!undoId) { showToast('Import failed: not enough browser storage. Nothing was changed.', { type: 'error' }); return; }
    showToast(`Imported ${result.summary.tasks} tasks and ${result.summary.journalEntries} journal entries`, {
      type: 'success', duration: 15000,
      actionText: undoId === 'none' ? null : 'Undo',
      onAction: undoId === 'none' ? null : () => actions.restoreSnapshot(undoId)
    });
  };
}

/** Validate backup text and open the right dialog. Used by the file picker. */
function importFromText(text, filename) {
  const result = validateImportData(text);
  if (!result.ok) { openImportErrorModal(result.errors, filename); return null; }
  openImportPreviewModal(result, filename);
  return result;
}

function importFromFile(file) {
  if (!file) return;
  if (file.size > IMPORT_MAX_CHARS) {
    openImportErrorModal(['The file is larger than 10 MB, which is too big to be a FlowBoard backup.'], file.name);
    return;
  }
  const reader = new FileReader();
  reader.onload = () => importFromText(String(reader.result || ''), file.name);
  reader.onerror = () => showToast('The file could not be read.', { type: 'error' });
  reader.readAsText(file);
}

/**
 * Render the currently active view into #main-content
 */
/**
 * Re-rendering replaces the page content, which would normally drop the cursor out of a text
 * box after every keystroke and throw keyboard focus off the button that was just pressed.
 * These two helpers remember the focused control (by id, or by its data-* attributes) and the
 * caret position, and put them back on the re-drawn control.
 */
function captureFocusSnapshot(container) {
  const el = document.activeElement;
  if (!el || el === document.body || !container.contains(el)) return null;
  const snap = describeFocusTarget(el);
  if (!snap) return null;
  try { snap.start = el.selectionStart; snap.end = el.selectionEnd; snap.dir = el.selectionDirection; } catch (e) { /* not a text field */ }
  return snap;
}

function restoreFocusSnapshot(snap, container) {
  if (!snap) return;
  const el = findFocusTarget(snap, container || document);
  if (!el || typeof el.focus !== 'function') return;
  try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); }
  try {
    if (typeof snap.start === 'number') el.setSelectionRange(snap.start, snap.end, snap.dir || 'none');
  } catch (e) { /* number and date inputs have no caret */ }
}

function renderActiveView() {
  const container = document.getElementById('main-content');
  if (!container) return;
  const focusSnap = captureFocusSnapshot(container);

  const s = getState();
  const activeView = selectors.getActiveView(s);

  // Leaving Insights: release its charts (the Insights view re-creates them each time it draws)
  if (activeView !== 'insights' && typeof destroyInsightsCharts === 'function') destroyInsightsCharts();

  switch (activeView) {
    case 'kanban':
      renderKanbanView(container);
      break;
    case 'planner':
      renderPlannerView(container);
      break;
    case 'journal':
      renderJournalView(container);
      break;
    case 'insights':
      renderInsightsView(container);
      break;
    case 'settings':
      renderSettingsView(container);
      break;
    default:
      renderKanbanView(container);
  }

  restoreFocusSnapshot(focusSnap, container);
}

/**
 * Global Event Delegation Dispatcher
 * @param {Event} e
 */
function handleGlobalClick(e) {
  // If clicking outside move menu, close open move menu
  if (!e.target.closest('[data-action="toggle-move-menu"]') && activeMoveMenuTaskId) {
    activeMoveMenuTaskId = null;
    renderActiveView();
  }

  // Clicking anywhere outside an open toolbar dropdown closes it
  if (openKanbanMenu && !e.target.closest('[data-kanban-menu]')) {
    openKanbanMenu = null;
    renderActiveView();
  }

  const target = e.target.closest('[data-action]');
  if (!target) return;

  const action = target.getAttribute('data-action');

  // Choosing an option in a toolbar dropdown closes it and returns focus to its button
  if (action.startsWith('set-kanban-') && openKanbanMenu) {
    const menuKey = openKanbanMenu;
    openKanbanMenu = null;
    setTimeout(() => document.getElementById(`kanban-menu-btn-${menuKey}`)?.focus(), 0);
  }

  switch (action) {
    // Navigation & Views
    case 'switch-view': {
      const viewName = target.getAttribute('data-view-tab') || target.getAttribute('data-view');
      if (viewName) {
        actions.switchView(viewName);
      }
      break;
    }
    case 'toggle-theme': {
      actions.toggleTheme();
      break;
    }
    case 'set-theme-dark': {
      actions.setTheme('dark');
      break;
    }
    case 'set-theme-light': {
      actions.setTheme('light');
      break;
    }
    case 'set-theme-system': {
      actions.setTheme('system');
      break;
    }

    // Kanban Task Modal & Creation
    case 'open-new-task-modal': {
      openTaskModal(null, 'todo');
      break;
    }
    case 'quick-add-to-column': {
      const status = target.getAttribute('data-status') || 'todo';
      openTaskModal(null, status);
      break;
    }
    case 'edit-task': {
      const taskId = target.getAttribute('data-task-id');
      if (taskId) {
        openTaskModal(taskId);
      }
      break;
    }
    case 'delete-task': {
      const taskId = target.getAttribute('data-task-id');
      if (taskId) {
        actions.deleteTask(taskId);
      }
      break;
    }
    case 'close-modal': {
      closeModal();
      break;
    }

    // Button-Based Move Actions (Touch friendly)
    case 'move-task-prev': {
      const taskId = target.getAttribute('data-task-id');
      const s = getState();
      const task = s.tasks.find(t => t.id === taskId);
      if (task) {
        const colIndex = KANBAN_COLUMNS.findIndex(c => c.id === task.status);
        if (colIndex > 0) {
          const prevStatus = KANBAN_COLUMNS[colIndex - 1].id;
          actions.moveTask(taskId, prevStatus);
        }
      }
      break;
    }
    case 'move-task-next': {
      const taskId = target.getAttribute('data-task-id');
      const s = getState();
      const task = s.tasks.find(t => t.id === taskId);
      if (task) {
        const colIndex = KANBAN_COLUMNS.findIndex(c => c.id === task.status);
        if (colIndex < KANBAN_COLUMNS.length - 1) {
          const nextStatus = KANBAN_COLUMNS[colIndex + 1].id;
          actions.moveTask(taskId, nextStatus);
        }
      }
      break;
    }
    case 'toggle-move-menu': {
      const taskId = target.getAttribute('data-task-id');
      activeMoveMenuTaskId = (activeMoveMenuTaskId === taskId) ? null : taskId;
      renderActiveView();
      break;
    }
    case 'move-task-to': {
      const taskId = target.getAttribute('data-task-id');
      const targetStatus = target.getAttribute('data-target-status');
      if (taskId && targetStatus) {
        activeMoveMenuTaskId = null;
        actions.moveTask(taskId, targetStatus);
      }
      break;
    }

    // Subtask toggle
    case 'toggle-subtask': {
      const taskId = target.getAttribute('data-task-id');
      const subtaskId = target.getAttribute('data-subtask-id');
      if (taskId && subtaskId) {
        actions.toggleSubtask(taskId, subtaskId);
      }
      break;
    }

    // Tag filtering & management
    case 'filter-tag': {
      const tagId = target.getAttribute('data-tag-id');
      actions.setActiveTagFilter(tagId);
      break;
    }
    case 'clear-search': {
      actions.setSearchQuery('');
      break;
    }
    case 'open-tag-manager': {
      openTagManagerModal();
      break;
    }
    case 'delete-tag': {
      const tagId = target.getAttribute('data-tag-id');
      if (tagId) {
        actions.deleteTag(tagId);
        openTagManagerModal(); // Refresh modal
      }
      break;
    }
    case 'toggle-show-older-done': {
      actions.toggleShowOlderDone();
      break;
    }

    // Area Manager (M1.1)
    case 'open-area-manager': {
      openAreaManagerModal();
      break;
    }
    case 'delete-area': {
      const areaId = target.getAttribute('data-area-id');
      if (areaId) {
        actions.deleteArea(areaId);
        // If modal is open, refresh it
        const overlay = document.getElementById('app-modal-overlay');
        if (overlay) openAreaManagerModal();
      }
      break;
    }

    // Kanban toolbar (M1.1)
    case 'set-kanban-group-by': {
      actions.setKanbanGroupBy(target.value || target.getAttribute('data-value'));
      break;
    }
    case 'set-kanban-sort-by': {
      actions.setKanbanSortBy(target.value || target.getAttribute('data-value'));
      break;
    }
    case 'set-kanban-filter-area': {
      actions.setKanbanFilterArea(target.value || target.getAttribute('data-value'));
      break;
    }
    case 'set-kanban-filter-priority': {
      actions.setKanbanFilterPriority(target.value || target.getAttribute('data-value'));
      break;
    }
    case 'set-kanban-filter-scheduled': {
      actions.setKanbanFilterScheduled(target.value || target.getAttribute('data-value'));
      break;
    }
    case 'clear-kanban-filters': {
      actions.clearKanbanFilters();
      break;
    }
    case 'toggle-kanban-column': {
      const colStatus = target.getAttribute('data-col-status');
      if (colStatus) actions.toggleKanbanColumn(colStatus);
      break;
    }
    case 'toggle-kanban-group': {
      const groupKey = target.getAttribute('data-group-key');
      if (groupKey) actions.toggleKanbanGroup(groupKey);
      break;
    }
    case 'toggle-kanban-menu': {
      const menuKey = target.getAttribute('data-menu');
      openKanbanMenu = (openKanbanMenu === menuKey) ? null : menuKey;
      renderActiveView();
      document.getElementById(`kanban-menu-btn-${menuKey}`)?.focus();
      break;
    }
    case 'toggle-kanban-filters-panel': {
      actions.toggleKanbanFiltersPanel();
      break;
    }
    case 'apply-kanban-saved-view': {
      const viewId = target.getAttribute('data-view-id');
      if (viewId) actions.applyKanbanSavedView(viewId);
      break;
    }
    case 'clear-kanban-saved-view': {
      actions.clearKanbanSavedView();
      break;
    }

    // Focus timer (M2)
    case 'timer-toggle': {
      timerService.toggle();
      break;
    }
    case 'timer-reset': {
      timerService.reset();
      break;
    }
    case 'timer-preset': {
      timerService.setPreset(Number(target.getAttribute('data-minutes')));
      break;
    }
    case 'timer-log': {
      timerService.logElapsed();
      break;
    }
    case 'toggle-sound': {
      actions.toggleSound();
      if (getState().settings.soundEnabled) timerService.playChime(); // short confirmation chime
      break;
    }
    case 'focus-task': {
      const taskId = target.getAttribute('data-task-id');
      if (taskId) timerService.focusOnTask(taskId);
      break;
    }

    // Habits (M2)
    case 'toggle-habit': {
      const habitId = target.getAttribute('data-habit-id');
      if (habitId) actions.toggleHabit(habitId, getLocalDateString(new Date()));
      break;
    }
    case 'open-habit-manager': {
      openHabitManagerModal();
      break;
    }
    case 'delete-habit': {
      const habitId = target.getAttribute('data-habit-id');
      if (habitId) actions.deleteHabit(habitId);
      break;
    }

    // Weekly planner (M3)
    case 'planner-prev': {
      actions.shiftPlannerWeek(-1);
      break;
    }
    case 'planner-next': {
      actions.shiftPlannerWeek(1);
      break;
    }
    case 'planner-today': {
      actions.setPlannerWeek(getLocalDateString(new Date()));
      break;
    }
    case 'planner-schedule': {
      actions.scheduleTask(target.getAttribute('data-task-id'), target.getAttribute('data-date'));
      break;
    }
    case 'planner-unschedule': {
      actions.scheduleTask(target.getAttribute('data-task-id'), null);
      break;
    }
    case 'planner-shift': {
      actions.shiftTaskDay(target.getAttribute('data-task-id'), Number(target.getAttribute('data-delta')));
      break;
    }
    case 'planner-toggle-done': {
      actions.toggleTaskDone(target.getAttribute('data-task-id'));
      break;
    }
    case 'carry-over-task': {
      actions.carryOverTask(target.getAttribute('data-task-id'), target.getAttribute('data-target'));
      break;
    }
    case 'carry-over-all': {
      actions.carryOverAll();
      break;
    }
    case 'toggle-habit-date': {
      const habitId = target.getAttribute('data-habit-id');
      const date = target.getAttribute('data-date');
      if (habitId && date) actions.toggleHabit(habitId, date);
      break;
    }

    // Journal (M4)
    case 'journal-prev': {
      actions.shiftJournalDate(-1);
      break;
    }
    case 'journal-next': {
      actions.shiftJournalDate(1);
      break;
    }
    case 'journal-today': {
      actions.setJournalDate(getLocalDateString(new Date()));
      break;
    }
    case 'journal-open-date': {
      actions.setJournalDate(target.getAttribute('data-date'));
      const main = document.getElementById('main-content');
      if (main && typeof main.scrollIntoView === 'function') main.scrollIntoView({ block: 'start' });
      break;
    }
    case 'journal-mood': {
      actions.setJournalMood(target.getAttribute('data-journal-date'), Number(target.getAttribute('data-mood')));
      break;
    }
    case 'journal-pull-done': {
      actions.pullDoneTasks(target.getAttribute('data-journal-date'));
      break;
    }
    case 'journal-send-kanban': {
      openSendToKanbanModal(target.getAttribute('data-journal-date'));
      break;
    }
    case 'journal-delete-entry': {
      actions.deleteJournalEntry(target.getAttribute('data-journal-date'));
      break;
    }

    // Settings actions
    case 'download-json-backup': {
      exportFullBackup();
      break;
    }
    case 'export-csv': {
      exportTasksCsv();
      break;
    }
    case 'toggle-setting': {
      const key = target.getAttribute('data-setting');
      if (key) actions.setSetting(key, !getState().settings[key]);
      break;
    }
    case 'snapshot-now': {
      actions.snapshotNow();
      break;
    }
    case 'settings-restore-snapshot': {
      openRestoreSnapshotModal(target.getAttribute('data-snapshot-id'));
      break;
    }
    case 'settings-delete-snapshot': {
      if (deleteSnapshot(target.getAttribute('data-snapshot-id'))) {
        showToast('Backup copy deleted', { type: 'info' });
        safeRender();
      }
      break;
    }
    case 'open-load-sample': {
      openLoadSampleModal();
      break;
    }
    case 'open-start-blank': {
      openStartBlankModal();
      break;
    }
    // Insights (M5)
    case 'insights-range': {
      actions.setInsightsRange(target.getAttribute('data-range'));
      break;
    }
    case 'insights-toggle-tables': {
      actions.toggleInsightsTables();
      break;
    }

    // Welcome and help (M7)
    case 'open-shortcuts': {
      openShortcutsModal();
      break;
    }
    case 'onboarding-skip': {
      skipOnboarding();
      break;
    }

    case 'test-corrupted-recovery': {
      showCorruptedStateModal('{ "invalidJson": [bad_syntax] }', new Error('Unexpected token in JSON'), { preview: true });
      break;
    }

    default:
      break;
  }
}

/**
 * Setup Keyboard Shortcuts
 */
function setupKeyboardShortcuts() {
  // Toolbar dropdowns: Escape closes, Up/Down move between options. Card 'Move to' menu: Escape closes.
  window.addEventListener('keydown', (e) => {
    // A dialog is open but keyboard focus is outside it (for example after a click on the dimmed
    // background): Escape still closes it, and Tab goes back into the dialog.
    const dialog = document.getElementById('app-modal-overlay');
    if (dialog && !dialog.contains(e.target) && (e.key === 'Escape' || e.key === 'Tab')) {
      if (e.key === 'Tab') {
        const first = dialog.querySelector('button:not([disabled]), input:not([disabled]), textarea:not([disabled]), select:not([disabled])');
        if (first) { e.preventDefault(); first.focus(); }
      } else if (typeof dialog.onkeydown === 'function') {
        dialog.onkeydown(e);
      }
      return;
    }
    if (e.key === 'Escape' && activeMoveMenuTaskId && !openKanbanMenu && !document.getElementById('app-modal-overlay')) {
      const taskId = activeMoveMenuTaskId;
      activeMoveMenuTaskId = null;
      renderActiveView();
      const again = findFocusTarget(
        { selector: `button[data-action="toggle-move-menu"][data-task-id="${String(taskId).replace(/\\/g, '\\\\').replace(/"/g, '\\"')}"]`, fallback: null },
        document.getElementById('main-content'));
      if (again) again.focus();
      return;
    }
    if (!openKanbanMenu) return;
    if (e.key === 'Escape') {
      const key = openKanbanMenu;
      openKanbanMenu = null;
      renderActiveView();
      document.getElementById(`kanban-menu-btn-${key}`)?.focus();
    } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      const items = [...document.querySelectorAll(`[data-kanban-menu="${openKanbanMenu}"] [role="menuitemradio"]`)];
      if (items.length === 0) return;
      e.preventDefault();
      const i = items.indexOf(document.activeElement);
      const next = e.key === 'ArrowDown' ? (i + 1) % items.length : (i <= 0 ? items.length - 1 : i - 1);
      items[next].focus();
    }
  });

  // Screen tabs: Left/Right (and Home/End) move between screens, as screen-reader users expect of tabs
  const tablist = document.getElementById('view-tablist');
  if (tablist) {
    tablist.addEventListener('keydown', (e) => {
      const tabs = [...tablist.querySelectorAll('[role="tab"]')];
      const i = tabs.indexOf(document.activeElement);
      if (i < 0) return;
      let next = null;
      if (e.key === 'ArrowRight') next = (i + 1) % tabs.length;
      else if (e.key === 'ArrowLeft') next = (i - 1 + tabs.length) % tabs.length;
      else if (e.key === 'Home') next = 0;
      else if (e.key === 'End') next = tabs.length - 1;
      if (next === null) return;
      e.preventDefault();
      tabs[next].focus();
      actions.switchView(tabs[next].getAttribute('data-view-tab'));
    });
  }

  window.addEventListener('keydown', (e) => {
    // Leave browser and system shortcuts (Ctrl+N, Cmd+/ ...) alone
    if (e.ctrlKey || e.metaKey || e.altKey) return;

    // Ignore when focus is inside an input, textarea, or contentEditable
    if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName) || e.target.isContentEditable) {
      return;
    }

    // Don't trigger if a dialog or the recovery screen is open
    if (document.getElementById('app-modal-overlay') || document.getElementById('corrupted-state-modal')) {
      return;
    }

    if (e.key === '?') {
      e.preventDefault();
      openShortcutsModal();
    } else if (e.key === 'u' || e.key === 'U') {
      if (triggerLatestUndo()) e.preventDefault();
    } else if (e.key === 'n' || e.key === 'N') {
      e.preventDefault();
      // Ensure we are in kanban view or switch to it
      if (selectors.getActiveView() !== 'kanban') {
        actions.switchView('kanban');
      }
      openTaskModal(null, 'todo');
    } else if (e.key === '/') {
      e.preventDefault();
      if (selectors.getActiveView() !== 'kanban') {
        actions.switchView('kanban');
      }
      const searchInput = document.getElementById('kanban-search-input');
      if (searchInput) {
        searchInput.focus();
        searchInput.select();
      }
    }
  });
}

// FIRST-RUN WELCOME (M7)
// Shown once, in a browser with no saved FlowBoard data. Escape or 'Skip for now' keeps the
// default workspace. Nothing here can touch existing data: it only appears before any exists.

function skipOnboarding() {
  actions.completeOnboarding({ skipped: true });
  closeModal();
  showToast('Welcome to FlowBoard. Press ? any time to see the keyboard shortcuts.', { duration: 6000 });
}

function openOnboardingModal() {
  const cap = (getState().settings && getState().settings.capacityByWeekday) || {};
  const numInput = 'w-full px-3 py-2 min-h-[44px] text-sm rounded-lg border border-[var(--border-color)] bg-[var(--bg-secondary)] text-[var(--text-primary)]';
  const legend = 'text-sm font-semibold text-[var(--text-primary)] mb-2';
  const choice = (value, title, desc, checked) => `
    <label class="onboard-choice flex items-start gap-3 p-3 rounded-xl border border-[var(--border-color)] bg-[var(--bg-secondary)] cursor-pointer">
      <input type="radio" name="start" value="${value}" ${checked ? 'checked' : ''} class="mt-1 w-4 h-4 flex-shrink-0" style="accent-color: var(--accent)">
      <span>
        <span class="block text-sm font-semibold text-[var(--text-primary)]">${title}</span>
        <span class="block text-xs text-[var(--text-secondary)] mt-0.5">${desc}</span>
      </span>
    </label>`;
  const hoursBox = (id, name, label, value) => `
    <div>
      <label for="${id}" class="block text-xs font-medium text-[var(--text-secondary)] mb-1">${label}</label>
      <input id="${id}" name="${name}" type="number" min="0" max="16" step="0.25" inputmode="decimal" value="${esc(value)}" class="${numInput}">
    </div>`;

  const html = `
    <form id="onboarding-form" class="modal-dialog p-6 text-[var(--text-primary)]" role="dialog" aria-modal="true" aria-labelledby="onboarding-title" aria-describedby="onboarding-intro">
      <h2 id="onboarding-title" class="text-xl font-bold">Welcome to FlowBoard</h2>
      <p id="onboarding-intro" class="text-sm text-[var(--text-secondary)] mt-1 mb-5">Plan your week, focus with a timer, and reflect each day. Three quick choices and you are in. Everything can be changed later in Settings.</p>

      <fieldset class="mb-5">
        <legend class="${legend}">1. How do you want to start?</legend>
        <div class="grid sm:grid-cols-2 gap-2">
          ${choice('blank', 'Start blank', 'An empty board, ready for your own tasks.', true)}
          ${choice('sample', 'Explore with sample data', 'Ten example tasks, habits and journal days to click around. Clear them later with Start blank.', false)}
        </div>
      </fieldset>

      <fieldset class="mb-5">
        <legend class="${legend}">2. Hours of planned work per day</legend>
        <div class="grid grid-cols-3 gap-3">
          ${hoursBox('onboard-weekday', 'weekdayHours', 'Mon to Fri', Number(cap.Mon ?? 6))}
          ${hoursBox('onboard-sat', 'saturdayHours', 'Saturday', Number(cap.Sat ?? 2))}
          ${hoursBox('onboard-sun', 'sundayHours', 'Sunday', Number(cap.Sun ?? 0))}
        </div>
        <p class="text-xs text-[var(--text-secondary)] mt-1.5">The Weekly Planner warns you when a day holds more than this. Use 0 for a day off.</p>
      </fieldset>

      <fieldset class="mb-5">
        <legend class="${legend}">3. One habit to track <span class="font-normal text-[var(--text-secondary)]">(optional)</span></legend>
        <label for="onboard-habit" class="sr-only">Habit name</label>
        <input id="onboard-habit" name="habitTitle" type="text" maxlength="60" autocomplete="off" placeholder="e.g. 90m morning deep work" class="${numInput} mb-2">
        <div class="flex flex-wrap gap-1" role="group" aria-label="Repeat the habit on">${buildHabitDayChips('habitDays', [1, 2, 3, 4, 5], null)}</div>
      </fieldset>

      <p class="text-xs text-[var(--text-secondary)] mb-4">Your data is stored only in this browser, on this device. Export a backup file from Settings every week or so.</p>

      <div class="flex flex-wrap justify-end gap-2">
        <button type="button" data-action="onboarding-skip" class="btn-secondary">Skip for now</button>
        <button type="submit" class="btn-primary">Get started</button>
      </div>
    </form>`;

  openModal(html, 'input[name="start"]:checked');
  const overlay = document.getElementById('app-modal-overlay');
  if (!overlay) return;

  // Escape counts as Skip (so the welcome never comes back); clicking outside does nothing
  const trapKeys = overlay.onkeydown;
  overlay.onkeydown = (e) => {
    if (e.key === 'Escape') { e.preventDefault(); skipOnboarding(); return; }
    if (typeof trapKeys === 'function') trapKeys(e);
  };
  overlay.onclick = null;

  overlay.onsubmit = (e) => {
    if (!e.target || e.target.id !== 'onboarding-form') return;
    e.preventDefault();
    const form = e.target;
    const start = form.querySelector('input[name="start"]:checked')?.value === 'sample' ? 'sample' : 'blank';
    const ok = actions.completeOnboarding({
      start,
      weekdayHours: form.elements['weekdayHours'].value,
      saturdayHours: form.elements['saturdayHours'].value,
      sundayHours: form.elements['sundayHours'].value,
      habitTitle: form.elements['habitTitle'].value,
      habitDays: [...form.querySelectorAll('input[name="habitDays"]:checked')].map(i => Number(i.value))
    });
    if (!ok) {
      showToast('Your choices could not be saved in this browser. Check that storage is allowed, then try again.', { type: 'error', duration: 8000 });
      return;
    }
    closeModal();
    showToast(start === 'sample'
      ? 'Sample data loaded. When you are ready for your own, use Settings, Start blank.'
      : 'You are set up. Press N to add your first task, or ? for all shortcuts.', { type: 'success', duration: 8000 });
  };
}

/** Show or hide the Offline badge. With announce=true (a real change), also say it in a toast. */
function updateOfflineIndicator(announce = false) {
  const offline = typeof navigator !== 'undefined' && navigator.onLine === false;
  const badge = document.getElementById('offline-indicator');
  if (badge) badge.hidden = !offline;
  if (announce) {
    showToast(offline
      ? 'You are offline. FlowBoard keeps working and saves on this device.'
      : 'You are back online.', { type: offline ? 'warning' : 'success', duration: 5000 });
  }
  return offline;
}

/**
 * Boot the application
 */
function initApp() {
  initState();
  // A new session starts on today: the planner opens on this week and the journal on today
  const startState = getState();
  startState.ui.plannerWeek = getWeekMonday(new Date());
  startState.ui.journalDate = getLocalDateString(new Date());
  applyCurrentTheme();
  applyDisplaySettings();
  ensureDailySnapshot();      // once a day: keep a restorable copy (if automatic backups are on)

  // Scrolling over a focused number box must not silently change its value (Chrome does this by default)
  document.addEventListener('wheel', (e) => {
    const el = document.activeElement;
    if (el && el.tagName === 'INPUT' && el.type === 'number' && e.target === el) el.blur();
  }, { passive: true });

  // Watch for system color scheme changes when theme is set to 'system'
  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      const s = getState();
      if (s?.settings?.theme === 'system') {
        applyCurrentTheme();
        renderAppShell();
      }
    });
  }

  // Bind global event delegation
  document.addEventListener('click', handleGlobalClick);
  setupKeyboardShortcuts();

  // Offline badge: FlowBoard needs no connection, but it is good to know why a hosted page will not reload
  window.addEventListener('online', () => updateOfflineIndicator(true));
  window.addEventListener('offline', () => updateOfflineIndicator(true));
  updateOfflineIndicator(false);

  // Timer bar: task picker fires 'change', everything else is click delegation
  const timerBarEl = document.getElementById('timer-bar');
  if (timerBarEl) {
    timerBarEl.addEventListener('change', (e) => {
      if (e.target && e.target.id === 'timer-task-select') {
        timerService.linkTask(e.target.value || null);
      }
    });
  }
  // Saves are normally batched for a moment; flush them when the page is hidden or closed
  const flushSave = () => { try { saveStateImmediate(getState()); } catch (e) { /* nothing to do */ } };
  window.addEventListener('pagehide', flushSave);
  document.addEventListener('visibilitychange', () => { if (document.hidden) flushSave(); });

  // Planner intention boxes save as you type; Settings capacity boxes save on change
  const mainEl = document.getElementById('main-content');
  if (mainEl) {
    mainEl.addEventListener('input', (e) => {
      const el = e.target;
      if (!el || !el.hasAttribute) return;
      if (el.hasAttribute('data-intention-date')) {
        actions.setDayIntention(el.getAttribute('data-intention-date'), el.value);
      } else if (el.hasAttribute('data-journal-field')) {
        actions.setJournalText(el.getAttribute('data-journal-date'), el.getAttribute('data-journal-field'), el.value);
        journalAfterEdit();
      } else if (el.hasAttribute('data-journal-energy')) {
        actions.setJournalEnergy(el.getAttribute('data-journal-date'), el.value);
        const out = document.getElementById('journal-energy-value');
        if (out) {
          out.textContent = `${el.value} / 10`;
          out.className = 'text-sm font-mono text-[var(--text-primary)]';
        }
        journalAfterEdit();
      } else if (el.hasAttribute('data-journal-search')) {
        actions.setJournalSearch(el.value);
      }
    });
    mainEl.addEventListener('change', (e) => {
      const el = e.target;
      if (!el || !el.hasAttribute) return;
      if (el.hasAttribute('data-capacity-day')) {
        actions.setCapacity(el.getAttribute('data-capacity-day'), el.value);
      } else if (el.hasAttribute('data-import-file')) {
        const file = el.files && el.files[0];
        el.value = '';                       // allow choosing the same file again later
        importFromFile(file);
      } else if (el.hasAttribute('data-timer-preset-index')) {
        const values = [0, 1, 2, 3].map(i => document.getElementById(`preset-${i}`)?.value);
        actions.setTimerPresets(values);
      } else if (el.hasAttribute('data-setting-input')) {
        actions.setSetting(el.getAttribute('data-setting-input'), el.value);
      } else if (el.hasAttribute('data-journal-date-input')) {
        if (el.value) actions.setJournalDate(el.value);
      } else if (el.hasAttribute('data-journal-tag')) {
        actions.setJournalTag(el.getAttribute('data-journal-date'), el.value);
        journalAfterEdit();
      }
    });
  }
  // Browsers only allow audio after a user gesture: unlock it on the first click anywhere
  document.addEventListener('click', () => timerService.ensureAudio(), { once: true, capture: true });

  // Initial renders
  renderAppShell();
  renderActiveView();
  renderTimerBar();
  renderHabitStrip();
  timerService.init();

  // First run in this browser: show the welcome (never while the storage recovery screen is up)
  if (!storageRecoveryActive && getState().meta && getState().meta.onboarded === false) {
    openOnboardingModal();
  }

  console.log(`[FlowBoard Work OS] v${APP_VERSION} initialized successfully.`);
}

// Auto-boot on DOM ready
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initApp);
} else {
  initApp();
}
</script>
</body>
</html>
